    leggTilTodoKnapp.title = 'Legg til to do';
    leggTilTodoKnapp.style.cssText = `font-size:11px;font-weight:700;font-family:'Syne',sans-serif;color:${knappFarge};padding:0 6px;width:auto;`;
    leggTilTodoKnapp.textContent = '+ to do';
    leggTilTodoKnapp.onclick = e => {
      e.stopPropagation();
      åpneTodoModal(null, null, a.id);
    };
    kort.appendChild(leggTilTodoKnapp);

    const leggTilOppgaveKnapp = document.createElement('button');
    leggTilOppgaveKnapp.className = 'ikon-knapp';
    leggTilOppgaveKnapp.textContent = '+';
    leggTilOppgaveKnapp.title = 'Legg til oppgave';
    leggTilOppgaveKnapp.style.cssText = `font-size:18px;font-weight:400;color:${knappFarge};line-height:1;`;
    leggTilOppgaveKnapp.onclick = e => {
      e.stopPropagation();
      åpneOppgaveModal(null, a.id);
    };
    kort.appendChild(leggTilOppgaveKnapp);
    wrapper.appendChild(kort);

    ytre.appendChild(slettBg);
    ytre.appendChild(wrapper);
    leggTilSveipSlett(ytre, wrapper, slettBg, () => {
      aktiviteter = aktiviteter.filter(x => x.id !== a.id);
      oppgaver.forEach(o => { if (o.aktivitetId === a.id) o.aktivitetId = null; });
      lagre();
      oppdaterAktivPanel();
    });
    return ytre;
  }

  /* ──────────────────────────────
     OPPGAVER
  ────────────────────────────── */
  function renderOppgaver() {
    const container = document.getElementById('oppgaveListe');
    const filterRad = document.getElementById('filterRad');

    // Hent data (kan være multi-prosjekt)
    const fd = _hentTabFilterData('oppgave');
    const fAktiviteter = fd.aktiviteter;
    const fOppgaver = fd.oppgaver;
    const fKategorier = fd.kategorier;
    const isMulti = fd.multi;

    filterRad.innerHTML = '';

    // Hvis vi viser en spesifikk aktivitet, vis eget header og tilbake-knapp
    if (aktivFilter && aktivFilter.startsWith('aktivitet:')) {
      const aktId = aktivFilter.slice(10);
      const akt   = fAktiviteter.find(a => a.id === aktId);
      const pill  = document.createElement('button');
      pill.className = 'filter-pill aktiv';
      pill.textContent = '← ' + (akt ? akt.tittel : 'Leveranse');
      pill.onclick = () => { aktivFilter = null; renderOppgaver(); };
      filterRad.appendChild(pill);
    } else {
      // Dynamiske kategori-filtere
      const visKat = isMulti ? [...new Map(fKategorier.map(k => [k.id, k])).values()] : kategorier;
      visKat.forEach(k => {        const pill = document.createElement('button');
        const state = oppgaveFilterState[k.id] || 1;
        let cls = 'filter-pill ';
        if (state === 2) cls += 'aktiv-' + k.id;
        else if (state === 3) cls += 'farge-' + k.id + ' ekskluder';
        else cls += 'farge-' + k.id;
        pill.className = cls;
        pill.textContent = k.label;
        pill.title = state === 1 ? 'Trykk for å vise kun denne' : state === 2 ? 'Trykk for å skjule denne' : 'Trykk for å vise alle';
        pill.onclick = () => {
          oppgaveFilterState[k.id] = (oppgaveFilterState[k.id] || 1) % 3 + 1;
          lagreFilterState(_pk('fo'), oppgaveFilterState);
          renderOppgaver();
        };
        filterRad.appendChild(pill);
      });
    }

    let filtrert = [...fOppgaver];
    if (!isMulti && globalKatFilter) filtrert = filtrert.filter(o => matcherGlobalFilter(null, o.kategoriId, o.aktivitetId));

    if (aktivFilter && aktivFilter.startsWith('aktivitet:')) {
      const aktId = aktivFilter.slice(10);
      filtrert = filtrert.filter(o => o.aktivitetId === aktId && !o.fullfort);
    } else {
      filtrert = filtrert.filter(o => !o.fullfort);
      const harKunOpp = katIds().some(k => oppgaveFilterState[k] === 2);
      if (harKunOpp) {
        filtrert = filtrert.filter(o => {
          const akt = fAktiviteter.find(a => a.id === o.aktivitetId);
          const type = akt?.type || o.kategoriId;
          return type && oppgaveFilterState[type] === 2;
        });
      } else {
        filtrert = filtrert.filter(o => {
          const akt = fAktiviteter.find(a => a.id === o.aktivitetId);
          const type = akt?.type || o.kategoriId;
          return !type || oppgaveFilterState[type] !== 3;
        });
      }
    }

    filtrert.sort((a, b) =>
      (a.frist || '9999').localeCompare(b.frist || '9999')
    );

    if (filtrert.length === 0) {
      container.innerHTML =
        '<div class="tom-melding">Ingen oppgaver her ennå.</div>';
      return;
    }

    container.innerHTML = '';

    // Group by month (frist-based; no-frist goes last under "Ingen frist")
    const grupper = {};
    filtrert.forEach(o => {
      let key, label;
      if (o.frist) {
        const d = new Date(o.frist + 'T00:00:00');
        key   = `${d.getFullYear()}-${String(d.getMonth()).padStart(2,'0')}`;
        label = MAANEDER[d.getMonth()] + ' ' + d.getFullYear();
      } else {
        key   = '9999-99';
        label = 'Ingen frist';
      }
      if (!grupper[key]) grupper[key] = { label, items: [] };
      grupper[key].items.push(o);
    });

    Object.values(grupper).forEach(g => {
      const ml = document.createElement('div');
      ml.className = 'maaned-label';
      ml.textContent = g.label;
      container.appendChild(ml);

      g.items.forEach(o => {
      const aktR = o.aktivitetId ? fAktiviteter.find(a => a.id === o.aktivitetId) : null;
      const typeR = aktR?.type || o.kategoriId;
      const stripeKlasse = typeR ? 'stripe-' + typeR : 'stripe-fri';

      const ytre = document.createElement('div');
      ytre.style.cssText = 'position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:1px;';

      const slettBg = document.createElement('div');
      slettBg.className = 'sveip-bakgrunn';
      slettBg.innerHTML = `<div class="slett-sirkel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></div>`;

      const wrapper = document.createElement('div');
      wrapper.className = 'sveip-innhold';

      const kort = document.createElement('div');
      kort.className = 'oppgave-kort ' + stripeKlasse + (o.fullfort ? ' fullfort' : '');

      const cb = document.createElement('div');
      cb.className = 'checkbox' + (o.fullfort ? ' sjekket' : '');
      cb.textContent = o.fullfort ? '✓' : '';
      cb.onclick = e => { e.stopPropagation(); toggleOppgave(o.id); };

      const info = document.createElement('div');
      info.className = 'oppgave-info';

      let metaHtml = '';
      if (isMulti && o._prosjektNavn) {
        const pFarge = prosjekter.find(p => p.id === o._prosjektId)?.farge || 'var(--grønn)';
        metaHtml += `<span class="tilknyttet-chip" style="border-color:${pFarge};color:${pFarge};font-size:10px;">${o._prosjektNavn}</span>`;
      }
      if (o.frist) metaHtml += fristSpan(o.frist, o.fullfort);
      if (o.aktivitetId) {
        const aktM = fAktiviteter.find(a => a.id === o.aktivitetId);
        if (aktM) metaHtml += `<span class="tilknyttet-chip chip-${aktM.type || "fri"}">${aktM.tittel}</span>`;
      } else if (o.kategoriId) {
        const katM = getKat(o.kategoriId);
        if (katM) metaHtml += `<span class="tilknyttet-chip chip-${katM.id}">${katM.label}</span>`;
      }
      const oppTodos = todos.filter(t => t.oppgaveId === o.id);
      if (oppTodos.length > 0) {
        const fullf = oppTodos.filter(t => t.fullfort).length;
        metaHtml += `<span style="font-size:11px;color:var(--tekst-sek);white-space:nowrap;">${fullf}/${oppTodos.length} to-do</span>`;
      }

      info.innerHTML = `
        <div class="oppgave-besk">${o.beskrivelse}</div>
        ${metaHtml ? '<div class="oppgave-meta">' + metaHtml + '</div>' : ''}`;

      kort.style.cursor = 'pointer';
      kort.onclick = () => åpneOppgaveInfo(o.id);

      kort.appendChild(cb);
      kort.appendChild(info);
      wrapper.appendChild(kort);

      ytre.appendChild(slettBg);
      ytre.appendChild(wrapper);
      leggTilSveipSlett(ytre, wrapper, slettBg, () => {
        todos.forEach(t => { if (t.oppgaveId === o.id) t.oppgaveId = null; });
        oppgaver = oppgaver.filter(x => x.id !== o.id);
        lagre();
        renderOppgaver();
        renderTodos();
      });
      container.appendChild(ytre);
      }); // end g.items.forEach
    }); // end Object.values(grupper).forEach
  }

  function åpneOppgaveInfo(id) {
    const o = oppgaver.find(o => o.id === id);
    if (!o) return;

    document.getElementById('oppInfoModalTittel').textContent = o.beskrivelse;

    const akt = o.aktivitetId ? aktiviteter.find(a => a.id === o.aktivitetId) : null;
    const fd  = o.frist ? new Date(o.frist + 'T00:00:00') : null;
    const iDag = new Date(); iDag.setHours(0,0,0,0);
    const forfalt = fd && !o.fullfort && fd < iDag;

    let html = '';

    // Status — kun vis hvis fullført
    if (o.fullfort) {
      html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <div style="width:22px;height:22px;border-radius:50%;border:2px solid var(--grønn);flex-shrink:0;background:var(--grønn);display:flex;align-items:center;justify-content:center;">
          <svg width="12" height="12" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span style="font-size:13px;color:var(--tekst-sek);">Fullført</span>
      </div>`;
    }

    // Frist
    if (fd) {
      const lbl = fristLabel(o.frist, o.fullfort);
      html += `<div style="padding:10px 12px;border-radius:var(--rs);background:${forfalt ? '#fdeaea' : 'var(--grønn-lys)'};font-size:13px;color:${lbl.farge};font-weight:${lbl.vekt};margin-bottom:14px;">
        ${lbl.tekst}
      </div>`;
    }

    // Tilknyttet aktivitet
    if (akt) {
      const ad = new Date(akt.dato + 'T00:00:00');
      html += `<div style="margin-bottom:14px;">
        <div style="font-size:11px;font-weight:700;font-family:'Syne',sans-serif;color:var(--tekst-sek);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Tilknyttet leveranse</div>
        <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--grønn-lys);border-radius:var(--rs);cursor:pointer;" onclick="lukkModal('oppgaveInfoModal');åpneAktivitetInfo('${akt.id}')">
          <span class="type-badge ${akt.type || ''}" style="font-size:10px;">${getKat(akt.type)?.label || ''}</span>
          <span style="font-size:13px;font-weight:600;color:var(--tekst);">${akt.tittel}</span>
          <span style="font-size:12px;color:var(--tekst-sek);margin-left:auto;">${ad.getDate()}. ${MAANEDER[ad.getMonth()]}</span>
        </div>
      </div>`;
    } else if (o.kategoriId) {
      const katI = getKat(o.kategoriId);
      if (katI) html += `<div style="margin-bottom:14px;">
        <div style="font-size:11px;font-weight:700;font-family:'Syne',sans-serif;color:var(--tekst-sek);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Kategori</div>
        <span class="type-badge ${katI.id}">${katI.label}</span>
      </div>`;
    }

    // Notater
    if (o.notat) {
      html += `<div style="margin-bottom:14px;">
        <div style="font-size:11px;font-weight:700;font-family:'Syne',sans-serif;color:var(--tekst-sek);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Notater</div>
        <div style="padding:12px;background:var(--grønn-lys);border-radius:var(--rs);font-size:13px;color:var(--tekst);line-height:1.5;">${o.notat}</div>
      </div>`;
    }

    // Tilknyttede to-do elementer
    const tilknyttedeTodos = todos.filter(t => t.oppgaveId === id);
    if (tilknyttedeTodos.length > 0) {
      const antallFullfort = tilknyttedeTodos.filter(t => t.fullfort).length;
      const antallTotalt   = tilknyttedeTodos.length;
      const prosent        = Math.round((antallFullfort / antallTotalt) * 100);

      html += `<div style="margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <div style="font-size:11px;font-weight:700;font-family:'Syne',sans-serif;color:var(--tekst-sek);text-transform:uppercase;letter-spacing:0.5px;">To-do (${antallFullfort} av ${antallTotalt})</div>
          <div style="font-size:11px;font-weight:700;color:var(--grønn);">${prosent}%</div>
        </div>
        <div style="height:5px;background:var(--kant);border-radius:3px;margin-bottom:10px;overflow:hidden;">
          <div style="height:100%;width:${prosent}%;background:var(--grønn);border-radius:3px;transition:width .3s;"></div>
        </div>`;

      tilknyttedeTodos.forEach(t => {
        html += `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--kant);cursor:pointer;" onclick="lukkModal('oppgaveInfoModal');åpneTodoInfo('${t.id}')">
          <div style="width:18px;height:18px;border-radius:50%;border:2px solid ${t.fullfort ? 'var(--grønn)' : 'var(--grønn-mid)'};flex-shrink:0;background:${t.fullfort ? 'var(--grønn)' : 'transparent'};display:flex;align-items:center;justify-content:center;">
            ${t.fullfort ? '<svg width="9" height="9" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
          </div>
          <div style="flex:1;font-size:13px;color:var(--tekst);${t.fullfort ? 'opacity:0.4;text-decoration:line-through;' : ''}">${t.tittel}</div>
          ${t.frist ? `<div style="font-size:11px;color:var(--tekst-sek);">${fristLabel(t.frist, t.fullfort).tekst}</div>` : ''}
        </div>`;
      });
      html += `</div>`;
    }

    document.getElementById('oppInfoModalBody').innerHTML = html;
    document.getElementById('oppInfoLeggTilTodoKnapp').onclick = () => {
      lukkModal('oppgaveInfoModal');
      åpneTodoModal(null, id);
    };
    document.getElementById('oppInfoRedigKnapp').onclick = () => {
      lukkModal('oppgaveInfoModal');
      åpneOppgaveModal(id);
    };
    document.getElementById('oppInfoSlettKnapp').onclick = () => {
      if (!confirm('Slett denne oppgaven?')) return;
      todos.forEach(t => { if (t.oppgaveId === id) t.oppgaveId = null; });
      oppgaver = oppgaver.filter(x => x.id !== id);
      lagre(); lukkModal('oppgaveInfoModal'); renderOppgaver(); renderTodos();
    };
    document.getElementById('oppInfoFullfortKnapp').textContent = o.fullfort ? '↩ Angre fullført' : '✓ Merk fullført';
    window._oppInfoId = id;
    document.getElementById('oppgaveInfoModal').classList.add('vis');
  }

  function toggleOppgaveFraInfo() {
    const id = window._oppInfoId;
    if (!id) return;
    toggleOppgave(id);
    åpneOppgaveInfo(id); // refresh
  }

  function toggleOppgave(id) {
    const o = oppgaver.find(o => o.id === id);
    if (o) {
      o.fullfort = !o.fullfort;
      o.fullfortDato = o.fullfort ? new Date().toISOString().slice(0,10) : null;
      lagre(); renderOppgaver(); renderTodos();
    }
  }

  /* ──────────────────────────────
     AKTIVITET MODAL
  ────────────────────────────── */
  function åpneAktivitetInfo(id) {
    const a = aktiviteter.find(a => a.id === id);
    if (!a) return;
    const erMilepel = a.leveranseType === 'milepæl';

    const d = new Date(a.dato + 'T00:00:00');
    let datoStr = UKEDAGER_K[d.getDay()] + ' ' + d.getDate() + '. ' + MAANEDER[d.getMonth()] + ' ' + d.getFullYear();
    if (!erMilepel && a.datoTil && a.datoTil !== a.dato) {
      const dTil = new Date(a.datoTil + 'T00:00:00');
      datoStr += ' – ' + dTil.getDate() + '. ' + MAANEDER[dTil.getMonth()];
    }
    const tidStr = (!erMilepel && a.tid) ? ('kl. ' + a.tid + (a.tidTil ? '–' + a.tidTil : '')) : '';

    document.getElementById('infoModalTittel').textContent = a.tittel;

    const body = document.getElementById('infoModalBody');

    const typeBadgeHtml = erMilepel
      ? `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:0.3px;background:${getKat(a.type)?.farge || 'var(--tekst-sek)'};color:white;">◆ Milepæl</span>`
      : '';
    const katBadgeHtml = a.type ? `<span class="type-badge ${a.type}">${getKat(a.type)?.label || a.type}</span>` : '';

    let html = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
        ${typeBadgeHtml}${katBadgeHtml}
      </div>
      <div style="font-size:13px;color:var(--tekst-sek);margin-bottom:4px;">${datoStr}${tidStr ? ' · ' + tidStr : ''}</div>`;

    if (a.beskrivelse) {
      html += `<div style="margin-top:14px;padding:12px;background:var(--grønn-lys);border-radius:var(--rs);font-size:13px;color:var(--tekst);line-height:1.5;">${a.beskrivelse}</div>`;
    }

    body.innerHTML = html;

    // Render oppgaver as proper cards like calendar view
    const tilknyttede = oppgaver.filter(o => o.aktivitetId === a.id && !o.fullfort);
    if (tilknyttede.length > 0) {
      const header = document.createElement('div');
      header.style.cssText = 'margin-top:18px;font-size:11px;font-weight:700;font-family:"Syne",sans-serif;color:var(--tekst-sek);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;';
      header.textContent = `Oppgaver (${tilknyttede.length})`;
      body.appendChild(header);

      tilknyttede.forEach(o => {
        const ytre = document.createElement('div');
        ytre.style.cssText = 'position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:1px;';

        const slettBg = document.createElement('div');
        slettBg.className = 'sveip-bakgrunn';
        slettBg.innerHTML = `<div class="slett-sirkel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></div>`;

        const wrapper = document.createElement('div');
        wrapper.className = 'sveip-innhold';

        const kort = document.createElement('div');
        kort.className = 'oppgave-kort stripe-' + a.type + (o.fullfort ? ' fullfort' : '');
        kort.style.cursor = 'pointer';
        kort.onclick = () => { lukkModal('aktivitetInfoModal'); åpneOppgaveInfo(o.id); };

        const cb = document.createElement('div');
        cb.className = 'checkbox' + (o.fullfort ? ' sjekket' : '');
        cb.textContent = o.fullfort ? '✓' : '';
        cb.onclick = e => {
          e.stopPropagation();
          toggleOppgave(o.id);
          åpneAktivitetInfo(id);
        };

        const info = document.createElement('div');
        info.className = 'oppgave-info';
        const metaHtml = o.frist ? fristSpan(o.frist, o.fullfort) : '';
        info.innerHTML = `<div class="oppgave-besk">${o.beskrivelse}</div>
          ${metaHtml ? '<div class="oppgave-meta">' + metaHtml + '</div>' : ''}`;

        kort.appendChild(cb);
        kort.appendChild(info);
        wrapper.appendChild(kort);
        ytre.appendChild(slettBg);
        ytre.appendChild(wrapper);
        leggTilSveipSlett(ytre, wrapper, slettBg, () => {
          oppgaver = oppgaver.filter(x => x.id !== o.id);
          lagre();
          åpneAktivitetInfo(id);
        });
        body.appendChild(ytre);

        // Todos knyttet til denne oppgaven
        const oTodos = todos.filter(t => t.oppgaveId === o.id);
        if (oTodos.length > 0) {
          const todoListe = document.createElement('div');
          todoListe.style.cssText = 'margin:1px 0 7px 20px;border-left:2px solid var(--kant);padding-left:10px;';
          oTodos.forEach(t => {
            const todoEl = document.createElement('div');
            todoEl.style.cssText = `display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px;color:${t.fullfort ? 'var(--tekst-sek)' : 'var(--tekst)'};`;
            const sirk = document.createElement('span');
            sirk.style.cssText = `width:11px;height:11px;border-radius:50%;border:1.5px solid ${t.fullfort ? 'var(--tekst-sek)' : 'var(--grønn)'};display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;color:${t.fullfort ? 'var(--tekst-sek)' : 'var(--grønn)'};`;
            sirk.textContent = t.fullfort ? '✓' : '';
            const tekst = document.createElement('span');
            tekst.style.cssText = t.fullfort ? 'text-decoration:line-through;flex:1;opacity:0.7;' : 'flex:1;';
            tekst.textContent = t.tittel;
            todoEl.appendChild(sirk);
            todoEl.appendChild(tekst);
            if (t.frist && !t.fullfort) {
              const fristEl = document.createElement('span');
              fristEl.style.cssText = 'font-size:11px;color:var(--tekst-sek);white-space:nowrap;';
              fristEl.textContent = fmtDatoFra(t.frist);
              todoEl.appendChild(fristEl);
            }
            todoListe.appendChild(todoEl);
          });
          body.appendChild(todoListe);
        }
      });

      // Todos koblet direkte til leveransen (ikke via oppgave)
      const direkteTodos = todos.filter(t => t.aktivitetId === a.id && !t.oppgaveId);
      if (direkteTodos.length > 0) {
        const dtHeader = document.createElement('div');
        dtHeader.style.cssText = 'margin-top:14px;font-size:11px;font-weight:700;font-family:"Syne",sans-serif;color:var(--tekst-sek);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;';
        dtHeader.textContent = `To do (${direkteTodos.length})`;
        body.appendChild(dtHeader);
        const dtListe = document.createElement('div');
        dtListe.style.cssText = 'display:flex;flex-direction:column;gap:2px;';
        direkteTodos.forEach(t => {
          const el = document.createElement('div');
          el.style.cssText = `display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--rs);background:var(--grønn-lys);font-size:12px;color:${t.fullfort ? 'var(--tekst-sek)' : 'var(--tekst)'};cursor:pointer;`;
          el.onclick = () => { lukkModal('aktivitetInfoModal'); åpneTodoInfo(t.id); };
          const sirk = document.createElement('span');
          sirk.style.cssText = `width:11px;height:11px;border-radius:50%;border:1.5px solid ${t.fullfort ? 'var(--tekst-sek)' : 'var(--grønn)'};display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;color:${t.fullfort ? 'var(--tekst-sek)' : 'var(--grønn)'};`;
          sirk.textContent = t.fullfort ? '✓' : '';
          const tekst = document.createElement('span');
          tekst.style.cssText = (t.fullfort ? 'text-decoration:line-through;opacity:0.7;' : '') + 'flex:1;';
          tekst.textContent = t.tittel;
          el.appendChild(sirk);
          el.appendChild(tekst);
          if (t.frist && !t.fullfort) {
            const fristEl = document.createElement('span');
            fristEl.style.cssText = 'font-size:11px;color:var(--tekst-sek);white-space:nowrap;';
            fristEl.textContent = fmtDatoFra(t.frist);
            el.appendChild(fristEl);
          }
          dtListe.appendChild(el);
        });
        body.appendChild(dtListe);
      }
    } else {
      // Sjekk om det finnes direktekoblede todos selv om ingen oppgaver
      const direkteTodosAlone = todos.filter(t => t.aktivitetId === a.id && !t.oppgaveId);
      if (direkteTodosAlone.length === 0) {
        const tom = document.createElement('div');
        tom.style.cssText = 'margin-top:18px;font-size:13px;color:var(--tekst-sek);';
        tom.textContent = 'Ingen oppgaver knyttet til denne leveransen.';
        body.appendChild(tom);
      }
      direkteTodosAlone.forEach(t => {
        const el = document.createElement('div');
        el.style.cssText = `display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--rs);background:var(--grønn-lys);font-size:12px;color:${t.fullfort ? 'var(--tekst-sek)' : 'var(--tekst)'};cursor:pointer;margin-top:4px;`;
        el.onclick = () => { lukkModal('aktivitetInfoModal'); åpneTodoInfo(t.id); };
        const sirk = document.createElement('span');
        sirk.style.cssText = `width:11px;height:11px;border-radius:50%;border:1.5px solid ${t.fullfort ? 'var(--tekst-sek)' : 'var(--grønn)'};display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;color:${t.fullfort ? 'var(--tekst-sek)' : 'var(--grønn)'};`;
        sirk.textContent = t.fullfort ? '✓' : '';
        const tekst = document.createElement('span');
        tekst.style.cssText = (t.fullfort ? 'text-decoration:line-through;opacity:0.7;' : '') + 'flex:1;';
        tekst.textContent = t.tittel;
        el.appendChild(sirk);
        el.appendChild(tekst);
        if (t.frist && !t.fullfort) {
          const fristEl = document.createElement('span');
          fristEl.style.cssText = 'font-size:11px;color:var(--tekst-sek);white-space:nowrap;';
          fristEl.textContent = fmtDatoFra(t.frist);
          el.appendChild(fristEl);
        }
        body.appendChild(el);
      });
    }

    // Lukk-knapp: skjul for milepæler (krysset øverst til høyre er nok)
    document.getElementById('infoModalLukkKnapp').style.display = erMilepel ? 'none' : '';

    // Fullfort-knapp (kun milepæler)
    const fullfortKnapp = document.getElementById('infoModalFullfortKnapp');
    if (erMilepel) {
      fullfortKnapp.style.display = '';
      fullfortKnapp.title = a.fullfort ? 'Angre fullføring' : 'Merk som fullført';
      fullfortKnapp.style.background = '';
      fullfortKnapp.style.color = a.fullfort ? '' : 'var(--grønn)';
      fullfortKnapp.style.borderColor = a.fullfort ? '' : 'var(--grønn)';
      fullfortKnapp.innerHTML = a.fullfort
        ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>`
        : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
      fullfortKnapp.onclick = () => fullfortMilepel(id);
    } else {
      fullfortKnapp.style.display = 'none';
      fullfortKnapp.onclick = null;
    }

    document.getElementById('infoModalRedigKnapp').onclick = () => {
      lukkModal('aktivitetInfoModal');
      if (a.leveranseType === 'milepæl') åpneMilepelModal(id);
      else åpneAktivitetModal(id);
    };
    document.getElementById('infoModalSlettKnapp').onclick = () => {
      if (!confirm('Slett denne leveransen?')) return;
      aktiviteter = aktiviteter.filter(x => x.id !== id);
      oppgaver.forEach(o => { if (o.aktivitetId === id) o.aktivitetId = null; });
      lagre(); lukkModal('aktivitetInfoModal'); oppdaterAktivPanel();
      if (valgtDato) renderValgtDag(valgtDato);
    };
    document.getElementById('infoModalLeggTilTodoKnapp').onclick = () => {
      lukkModal('aktivitetInfoModal');
      åpneTodoModal(null, null, id);
    };
    document.getElementById('infoModalLeggTilOppgaveKnapp').onclick = () => {
      lukkModal('aktivitetInfoModal');
      åpneOppgaveModal(null, id);
    };
    document.getElementById('aktivitetInfoModal').classList.add('vis');
  }

  function fullfortMilepel(id) {
    const a = aktiviteter.find(a => a.id === id);
    if (!a) return;
    a.fullfort = !a.fullfort;
    a.fullfortDato = a.fullfort ? new Date().toISOString().slice(0, 10) : null;
    lagre();
    lukkModal('aktivitetInfoModal');
    oppdaterAktivPanel();
  }

  function åpneArkiv() {
    const iDagStr = new Date().toISOString().slice(0, 10);
    const body = document.getElementById('arkivBody');
    body.innerHTML = '';

    const fullforteMilepeler = aktiviteter
      .filter(a => a.leveranseType === 'milepæl' && a.fullfort)
      .sort((a,b) => (b.fullfortDato || b.dato).localeCompare(a.fullfortDato || a.dato));

    const tidligereAkt = aktiviteter
      .filter(a => a.leveranseType !== 'milepæl' && (a.datoTil || a.dato) < iDagStr)
      .sort((a,b) => b.dato.localeCompare(a.dato));

    if (fullforteMilepeler.length === 0 && tidligereAkt.length === 0) {
      body.innerHTML = '<div style="padding:32px;text-align:center;color:var(--tekst-sek);font-size:13px;">Arkivet er tomt.</div>';
      document.getElementById('arkivModal').classList.add('vis');
      return;
    }

    const lagArkivItem = (a, ekstraInfo, knappTekst, knappOnClick) => {
      const kat = getKat(a.type);
      const erMp = a.leveranseType === 'milepæl';
      const d = new Date(a.dato + 'T00:00:00');
      const datoStr = d.getDate() + '. ' + MAANEDER[d.getMonth()] + ' ' + d.getFullYear();
      const el = document.createElement('div');
      el.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--kant);cursor:pointer;';
      el.onmouseover = () => el.style.background = 'var(--grønn-lys)';
      el.onmouseout  = () => el.style.background = '';
      el.onclick = () => { lukkModal('arkivModal'); åpneAktivitetInfo(a.id); };

      const katPill = document.createElement('span');
      if (erMp && kat) {
        katPill.style.cssText = `flex-shrink:0;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;font-family:'Syne',sans-serif;background:${kat.farge};color:white;`;
        katPill.textContent = '◆';
      } else if (kat) {
        katPill.style.cssText = `flex-shrink:0;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;font-family:'Syne',sans-serif;border:1.5px solid ${kat.farge};color:${kat.farge};`;
        katPill.textContent = kat.label;
      }
      el.appendChild(katPill);

      const tekst = document.createElement('div');
      tekst.style.cssText = 'flex:1;min-width:0;';
      tekst.innerHTML = `<div style="font-size:13px;font-weight:600;color:var(--tekst);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.tittel}</div>
        <div style="font-size:11px;color:var(--tekst-sek);">${datoStr}${ekstraInfo ? ' · ' + ekstraInfo : ''}</div>`;
      el.appendChild(tekst);

      if (knappTekst) {
        const knapp = document.createElement('button');
        knapp.className = 'knapp-sek';
        knapp.style.cssText = 'font-size:11px;padding:4px 10px;flex-shrink:0;white-space:nowrap;';
        knapp.textContent = knappTekst;
        knapp.onclick = e => { e.stopPropagation(); knappOnClick(); };
        el.appendChild(knapp);
      }
      return el;
    };

    if (fullforteMilepeler.length > 0) {
      const hdr = document.createElement('div');
      hdr.style.cssText = 'padding:12px 18px 6px;font-size:10px;font-weight:700;font-family:"Syne",sans-serif;text-transform:uppercase;letter-spacing:0.8px;color:var(--tekst-sek);background:var(--grønn-lys);border-bottom:1px solid var(--kant);';
      hdr.textContent = `◆ Fullførte milepæler (${fullforteMilepeler.length})`;
      body.appendChild(hdr);
      fullforteMilepeler.forEach(a => {
        const info = a.fullfortDato ? 'Fullført ' + fmtDatoFra(a.fullfortDato) : '';
        body.appendChild(lagArkivItem(a, info, '↩ Angre', () => { fullfortMilepel(a.id); åpneArkiv(); }));
      });
    }

    if (tidligereAkt.length > 0) {
      const hdr = document.createElement('div');
      hdr.style.cssText = 'padding:12px 18px 6px;font-size:10px;font-weight:700;font-family:"Syne",sans-serif;text-transform:uppercase;letter-spacing:0.8px;color:var(--tekst-sek);background:var(--grønn-lys);border-bottom:1px solid var(--kant);border-top:1px solid var(--kant);';
      hdr.textContent = `Tidligere aktiviteter (${tidligereAkt.length})`;
      body.appendChild(hdr);
      tidligereAkt.forEach(a => {
        const dTil = a.datoTil && a.datoTil !== a.dato ? ' – ' + fmtDatoFra(a.datoTil) : '';
        body.appendChild(lagArkivItem(a, fmtDatoFra(a.dato) + dTil, null, null));
      });
    }

    document.getElementById('arkivModal').classList.add('vis');
  }

  function settLeveranseModalType(type) {
    const erMilepel = type === 'milepæl';
    document.getElementById('feltLeveranseType').value = type;
    document.getElementById('feltDatoTilWrap').style.display = erMilepel ? 'none' : '';
    document.getElementById('feltTidRad').style.display = erMilepel ? 'none' : '';
    const datoLabel = document.querySelector('#feltDatoRad .felt:first-child label');
    if (datoLabel) datoLabel.textContent = erMilepel ? 'Dato' : 'Fra dato';
  }

  function åpneAktivitetModal(id = null, dato = null) {
    const feltType = document.getElementById('feltType');
    feltType.innerHTML = '';
    kategorier.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k.id; opt.textContent = k.label;
      feltType.appendChild(opt);
    });
    const slettKnapp = document.getElementById('slettAktivitetKnapp');

    if (id) {
      const a = aktiviteter.find(a => a.id === id);
      if (!a) return;
      redigAktivitetId = id;                         // ← nødvendig for at lagreAktivitet() oppdaterer riktig
      const erMilepel = a.leveranseType === 'milepæl';
      document.getElementById('aktivitetModalTittel').textContent = erMilepel ? 'Rediger milepæl' : 'Rediger aktivitet';
      settLeveranseModalType(a.leveranseType || 'aktivitet');
      document.getElementById('feltTittel').value  = a.tittel;
      document.getElementById('feltType').value    = a.type;
      document.getElementById('feltDato').value    = a.dato;
      document.getElementById('feltDatoTil').value = a.datoTil || a.dato;
      document.getElementById('feltTid').value     = a.tid    || '';
      document.getElementById('feltTidTil').value  = a.tidTil || '';
      document.getElementById('feltBesk').value   = a.beskrivelse || '';
      slettKnapp.style.display = 'block';
    } else {
      redigAktivitetId = null;
      document.getElementById('aktivitetModalTittel').textContent = 'Ny aktivitet';
      settLeveranseModalType('aktivitet');
      document.getElementById('feltTittel').value  = '';
      document.getElementById('feltType').value    = kategorier[0]?.id || '';
      const defaultDato = dato || new Date().toISOString().slice(0, 10);
      document.getElementById('feltDato').value    = defaultDato;
      document.getElementById('feltDatoTil').value = defaultDato;
      document.getElementById('feltTid').value     = '';
      document.getElementById('feltTidTil').value  = '';
      document.getElementById('feltBesk').value   = '';
      slettKnapp.style.display = 'none';
    }
    document.getElementById('aktivitetModal').classList.add('vis');
    setTimeout(() => document.getElementById('feltTittel').focus(), 100);
  }

  function visLeveranseTypeValg(btn) {
    // Fjern evt. eksisterende popup
    const gammel = document.getElementById('leveranseTypePopup');
    if (gammel) { gammel.remove(); return; }
    const popup = document.createElement('div');
    popup.id = 'leveranseTypePopup';
    popup.style.cssText = 'position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--bg);border:1px solid var(--kant);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.13);z-index:999;display:flex;gap:4px;padding:6px;white-space:nowrap;';
    popup.innerHTML = '<button class="todo-hurtig-knapp" style="font-size:12px;padding:6px 12px;" onclick="this.parentElement.remove();åpneAktivitetModal()">Aktivitet</button>'
      + '<button class="todo-hurtig-knapp" style="font-size:12px;padding:6px 12px;" onclick="this.parentElement.remove();åpneMilepelModal()">Milepæl</button>';
    btn.appendChild(popup);
    const lukk = e => { if (!popup.contains(e.target) && e.target !== btn) { popup.remove(); document.removeEventListener('click', lukk); } };
    setTimeout(() => document.addEventListener('click', lukk), 0);
  }

  function åpneMilepelModal(id = null, dato = null) {
    if (id) {
      åpneAktivitetModal(id, dato);
      return;
    }
    const feltType = document.getElementById('feltType');
    feltType.innerHTML = '';
    kategorier.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k.id; opt.textContent = k.label;
      feltType.appendChild(opt);
    });
    document.getElementById('aktivitetModalTittel').textContent = 'Ny milepæl';
    settLeveranseModalType('milepæl');
    document.getElementById('feltTittel').value  = '';
    document.getElementById('feltType').value    = kategorier[0]?.id || '';
    const defaultDato = dato || new Date().toISOString().slice(0, 10);
    document.getElementById('feltDato').value    = defaultDato;
    document.getElementById('feltDatoTil').value = '';
    document.getElementById('feltTid').value     = '';
    document.getElementById('feltTidTil').value  = '';
    document.getElementById('feltBesk').value   = '';
    document.getElementById('slettAktivitetKnapp').style.display = 'none';
    document.getElementById('aktivitetModal').classList.add('vis');
    setTimeout(() => document.getElementById('feltTittel').focus(), 100);
  }

  function lagreAktivitet() {
    const tittel        = document.getElementById('feltTittel').value.trim();
    const type          = document.getElementById('feltType').value;
    const dato          = document.getElementById('feltDato').value;
    const leveranseType = document.getElementById('feltLeveranseType').value || 'aktivitet';
    const erMilepel     = leveranseType === 'milepæl';
    const datoTil       = erMilepel ? dato : (document.getElementById('feltDatoTil').value || dato);
    const tid           = erMilepel ? '' : document.getElementById('feltTid').value;
    const tidTil        = erMilepel ? '' : document.getElementById('feltTidTil').value;
    const besk          = document.getElementById('feltBesk').value.trim();

    if (!tittel) { alert('Tittel er påkrevd.'); return; }
    if (!dato)   { alert('Dato er påkrevd.'); return; }

    if (redigAktivitetId) {
      const a = aktiviteter.find(a => a.id === redigAktivitetId);
      Object.assign(a, { tittel, type, dato, datoTil, tid, tidTil, beskrivelse: besk, leveranseType });
    } else {
      aktiviteter.push({ id: uid(), tittel, type, dato, datoTil, tid, tidTil, beskrivelse: besk, leveranseType });
    }

    lagre();
    lukkModal('aktivitetModal');
    oppdaterAktivPanel();
    if (valgtDato) renderValgtDag(valgtDato);
  }

  function slettAktivitet() {
    if (!confirm('Slett denne leveransen?')) return;
    aktiviteter = aktiviteter.filter(a => a.id !== redigAktivitetId);
    oppgaver.forEach(o => { if (o.aktivitetId === redigAktivitetId) o.aktivitetId = null; });
    lagre();
    lukkModal('aktivitetModal');
    oppdaterAktivPanel();
    if (valgtDato) renderValgtDag(valgtDato);
  }

  /* ──────────────────────────────
     OPPGAVE MODAL
  ────────────────────────────── */
  function settOppFrist(dager) {
    const d = new Date();
    d.setDate(d.getDate() + dager);
    const el = document.getElementById('oppFeltFrist');
    el.value = d.toISOString().slice(0, 10);
    el.style.display = '';
  }

  function toggleOppFristDato(btn) {
    const el = document.getElementById('oppFeltFrist');
    const visNå = el.style.display !== 'none' && el.style.display !== '';
    el.style.display = visNå ? 'none' : '';
    if (!visNå) setTimeout(() => el.showPicker?.(), 50);
  }

  function oppdaterFristInfo() { /* no-op — beholdes for kompatibilitet */ }

  function åpneOppgaveModal(id = null, preAktivitetId = null) {
    redigOppgaveId = id;
    const slettKnapp = document.getElementById('slettOppgaveKnapp');
    const katSelect  = document.getElementById('oppFeltKategori');

    // Fyll kategori-select (alltid alle)
    katSelect.innerHTML = '<option value="">— Ingen —</option>';
    kategorier.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k.id; opt.textContent = k.label;
      katSelect.appendChild(opt);
    });

    // Reset fristfelt
    const oppFristEl = document.getElementById('oppFeltFrist');
    oppFristEl.value = '';
    oppFristEl.style.display = 'none';
    document.getElementById('fristRelativInfo').style.display = 'none';

    if (id) {
      const o = oppgaver.find(o => o.id === id);
      if (!o) return;
      document.getElementById('oppgaveModalTittel').textContent = 'Rediger oppgave';
      document.getElementById('oppFeltBesk').value  = o.beskrivelse;
      document.getElementById('oppFeltNotat').value = o.notat || '';
      // Sett kategori FØR leveranse-fylling slik at filteret er riktig
      katSelect.value = o.kategoriId || '';
      if (o.aktivitetId && !o.kategoriId) {
        const aktKat = aktiviteter.find(a => a.id === o.aktivitetId);
        if (aktKat) katSelect.value = aktKat.type;
      }
      _oppdaterOppLevSelect(o.aktivitetId || '');
      if (o.frist) {
        oppFristEl.value = o.frist;
        oppFristEl.style.display = '';
      }
      slettKnapp.style.display = 'block';
    } else {
      document.getElementById('oppgaveModalTittel').textContent = 'Ny oppgave';
      document.getElementById('oppFeltBesk').value  = '';
      document.getElementById('oppFeltNotat').value = '';
      // Sett kategori FØR leveranse-fylling
      katSelect.value = '';
      if (preAktivitetId) {
        const preAkt = aktiviteter.find(a => a.id === preAktivitetId);
        if (preAkt) katSelect.value = preAkt.type;
      }
      _oppdaterOppLevSelect(preAktivitetId || '');
      slettKnapp.style.display = 'none';
    }
    document.getElementById('oppgaveModal').classList.add('vis');
    setTimeout(() => document.getElementById('oppFeltBesk').focus(), 100);
  }

  function lagreOppgave() {
    const besk        = document.getElementById('oppFeltBesk').value.trim();
    const notat       = document.getElementById('oppFeltNotat').value.trim();
    const aktivitetId = document.getElementById('oppFeltAktivitet').value || null;
    const kategoriId  = document.getElementById('oppFeltKategori').value || null;

    if (!besk) { alert('Tittel er påkrevd.'); return; }

    const frist = document.getElementById('oppFeltFrist').value || '';

    if (redigOppgaveId) {
      const o = oppgaver.find(o => o.id === redigOppgaveId);
      Object.assign(o, { beskrivelse: besk, notat, frist, aktivitetId, kategoriId });
    } else {
      const nyOppgave = { id: uid(), beskrivelse: besk, notat, frist, aktivitetId, kategoriId, fullfort: false };
      oppgaver.push(nyOppgave);
    }

    lagre();
    lukkModal('oppgaveModal');
    renderOppgaver();
    if (valgtDato) renderValgtDag(valgtDato);
  }

  function slettOppgave() {
    if (!confirm('Slett denne oppgaven?')) return;
    todos.forEach(t => { if (t.oppgaveId === redigOppgaveId) t.oppgaveId = null; });
    oppgaver = oppgaver.filter(o => o.id !== redigOppgaveId);
    lagre();
    lukkModal('oppgaveModal');
    renderOppgaver();
    renderTodos();
    if (valgtDato) renderValgtDag(valgtDato);
  }

  /* ──────────────────────────────
     MODAL UTILS
  ────────────────────────────── */
  function lukkModal(id) {
    document.getElementById(id).classList.remove('vis');
  }

  function oppdaterAktivPanel() {
    renderHovedFilter();
    const aktiv = document.querySelector('.panel.aktiv')?.id;
    if (aktiv === 'panel-todo')     renderTodos();
    if (aktiv === 'panel-kalender') {
      if (kalVisning === 'uke') renderUke();
      else if (kalVisning === 'tidslinje') renderTidslinje();
      else { renderKalender(); if (valgtDato) renderValgtDag(valgtDato); }
    }
    if (aktiv === 'panel-liste')    renderListe();
    if (aktiv === 'panel-oppgaver') renderOppgaver();
  }

  // Klikk utenfor modal lukker den
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.classList.remove('vis');
    });
  });

  // ESC lukker modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape')
