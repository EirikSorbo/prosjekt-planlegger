    // Alltid vis begge seksjoner med sine + Legg til-knapper
    listEl.appendChild(lagDagSeksjon('Leveranser', () => åpneAktivitetModal(null, ds)));
    if (dagAkt.length === 0) {
      const tom = document.createElement('div');
      tom.className = 'tom-melding';
      tom.style.cssText = 'padding:14px 20px;font-size:13px;';
      tom.textContent = 'Ingen leveranser.';
      listEl.appendChild(tom);
    } else {
      dagAkt.forEach(a => listEl.appendChild(lagAktivitetKort(a, true)));
    }

    listEl.appendChild(lagDagSeksjon('Oppgaver', () => åpneOppgaveModal()));
    if (dagOpp.length === 0) {
      const tom = document.createElement('div');
      tom.className = 'tom-melding';
      tom.style.cssText = 'padding:14px 20px;font-size:13px;';
      tom.textContent = 'Ingen oppgaver.';
      listEl.appendChild(tom);
    } else {
      dagOpp.forEach(o => {
        const akt = aktiviteter.find(a => a.id === o.aktivitetId);
        const vType = akt?.type || o.kategoriId;
        const stripeKlasse = vType ? 'stripe-' + vType : 'stripe-fri';

        const ytre = document.createElement('div');
        ytre.style.cssText = 'position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:1px;';

        const slettBg = document.createElement('div');
        slettBg.className = 'sveip-bakgrunn';
        slettBg.innerHTML = `<div class="slett-sirkel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></div>`;

        const wrapper = document.createElement('div');
        wrapper.className = 'sveip-innhold';

        const kort = document.createElement('div');
        kort.className = 'oppgave-kort ' + stripeKlasse;
        kort.style.cursor = 'pointer';
        kort.onclick = () => åpneOppgaveInfo(o.id);

        const cb = document.createElement('div');
        cb.className = 'checkbox' + (o.fullfort ? ' sjekket' : '');
        cb.textContent = o.fullfort ? '✓' : '';
        cb.onclick = e => { e.stopPropagation(); toggleOppgave(o.id); renderValgtDag(ds); };

        const info = document.createElement('div');
        info.className = 'oppgave-info';

        let metaHtml = '';
        if (o.frist) metaHtml += fristSpan(o.frist, o.fullfort);
        if (akt) {
          metaHtml += `<span class="tilknyttet-chip chip-${akt.type || "fri"}">${akt.tittel}</span>`;
        } else if (o.kategoriId) {
          const katV = getKat(o.kategoriId);
          if (katV) metaHtml += `<span class="tilknyttet-chip chip-${katV.id}">${katV.label}</span>`;
        }

        info.innerHTML = `<div class="oppgave-besk">${o.beskrivelse}</div>
          ${metaHtml ? '<div class="oppgave-meta">' + metaHtml + '</div>' : ''}`;

        kort.appendChild(cb);
        kort.appendChild(info);
        wrapper.appendChild(kort);
        ytre.appendChild(slettBg);
        ytre.appendChild(wrapper);
        leggTilSveipSlett(ytre, wrapper, slettBg, () => {
          oppgaver = oppgaver.filter(x => x.id !== o.id);
          lagre();
          renderValgtDag(ds);
        });
        listEl.appendChild(ytre);
      });
    }
    panel.classList.add('vis');
  }

  function lagDagSeksjon(label, onLeggTil) {
    const div = document.createElement('div');
    div.className = 'dag-seksjon-header';
    const lbl = document.createElement('span');
    lbl.className = 'dag-seksjon-label';
    lbl.textContent = label;
    const knapp = document.createElement('button');
    knapp.className = 'dag-seksjon-legg-til';
    knapp.textContent = '+ Legg til';
    knapp.onclick = e => { e.stopPropagation(); onLeggTil(); };
    div.appendChild(lbl);
    div.appendChild(knapp);
    return div;
  }

  function forrigeManad() {
    if (visMaaned === 0) { visMaaned = 11; visAar--; }
    else visMaaned--;
    nullstillValgtDag();
    renderKalender();
  }

  function nesteManad() {
    if (visMaaned === 11) { visMaaned = 0; visAar++; }
    else visMaaned++;
    nullstillValgtDag();
    renderKalender();
  }

  function nullstillValgtDag() {
    valgtDato = null;
    document.getElementById('valgtDagPanel').classList.remove('vis');
  }

  /* ──────────────────────────────
     LISTE
  ────────────────────────────── */
  function renderListe() {
    const container = document.getElementById('aktivitetListe');
    const filterRad = document.getElementById('aktivitetFilterRad');

    // Hent data (kan være multi-prosjekt)
    const fd = _hentTabFilterData('leveranse');
    const fAktiviteter = fd.aktiviteter;
    const fKategorier = fd.kategorier;
    const isMulti = fd.multi;

    // Bygg filterknapper (bruk unikke kategorier)
    filterRad.innerHTML = '';
    const visKat = isMulti ? [...new Map(fKategorier.map(k => [k.id, k])).values()] : kategorier;
    visKat.forEach(k => {
      const pill = document.createElement('button');
      const state = aktivitetFilterState[k.id] || 1;
      let cls = 'filter-pill ';
      if (state === 2) cls += 'aktiv-' + k.id;
      else if (state === 3) cls += 'farge-' + k.id + ' ekskluder';
      else cls += 'farge-' + k.id;
      pill.className = cls;
      pill.textContent = k.label;
      pill.title = state === 1 ? 'Trykk for å vise kun denne' : state === 2 ? 'Trykk for å skjule denne' : 'Trykk for å vise alle';
      pill.onclick = () => {
        aktivitetFilterState[k.id] = (aktivitetFilterState[k.id] || 1) % 3 + 1;
        lagreFilterState(_pk('fa'), aktivitetFilterState);
        renderListe();
      };
      filterRad.appendChild(pill);
    });

    const iDagStr = new Date().toISOString().slice(0, 10);
    let filtrert = [...fAktiviteter].filter(a => {
      if (a.leveranseType === 'milepæl' && a.fullfort) return false; // fullfort milepæl → arkiv
      if (a.leveranseType !== 'milepæl' && (a.datoTil || a.dato) < iDagStr) return false; // fortid → arkiv
      return true;
    });
    if (!isMulti && globalKatFilter) filtrert = filtrert.filter(a => a.type === globalKatFilter);
    const harKun = katIds().some(k => aktivitetFilterState[k] === 2);
    if (harKun) {
      filtrert = filtrert.filter(a => aktivitetFilterState[a.type] === 2);
    } else {
      filtrert = filtrert.filter(a => aktivitetFilterState[a.type] !== 3);
    }

    if (filtrert.length === 0) {
      container.innerHTML =
        '<div class="tom-melding">Ingen aktive leveranser.<br>Sjekk arkivet for fullførte og tidligere leveranser.</div>';
      return;
    }

    const sortert = filtrert.sort((a, b) =>
      (a.dato + (a.tid || '')).localeCompare(b.dato + (b.tid || ''))
    );
    const grupper = {};
    sortert.forEach(a => {
      const d   = new Date(a.dato + 'T00:00:00');
      const key = `${d.getFullYear()}-${String(d.getMonth()).padStart(2,'0')}`;
      if (!grupper[key]) {
        grupper[key] = {
          label: MAANEDER[d.getMonth()] + ' ' + d.getFullYear(),
          items: []
        };
      }
      grupper[key].items.push(a);
    });
    container.innerHTML = '';
    Object.values(grupper).forEach(g => {
      const ml = document.createElement('div');
      ml.className = 'maaned-label';
      ml.textContent = g.label;
      container.appendChild(ml);
      g.items.forEach(a => container.appendChild(lagAktivitetKort(a)));
    });
  }

  /* ──────────────────────────────
     UTILS
  ────────────────────────────── */
  /* ──────────────────────────────
     KATEGORIOVERSIKT
  ────────────────────────────── */
  function renderKatOversiktKnapper() {
    const rad = document.getElementById('katOversiktRad');
    if (!rad) return;
    rad.innerHTML = '';
    kategorier.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'kat-oversikt-knapp';
      btn.style.borderColor = k.farge;
      btn.style.color = k.farge;
      btn.textContent = k.label;
      btn.onclick = () => åpneKatOversikt(k.id);
      rad.appendChild(btn);
    });
  }

  function åpneKatOversikt(katId) {
    const kat = getKat(katId);
    if (!kat) return;

    document.getElementById('katOversiktTittel').textContent = kat.label;
    document.getElementById('katOversiktTittel').style.color = kat.farge;

    const body = document.getElementById('katOversiktBody');
    body.innerHTML = '';

    const iDag = new Date(); iDag.setHours(0,0,0,0);
    const iDagStr = iDag.toISOString().slice(0,10);

    const katAkt = aktiviteter.filter(a => a.type === katId)
      .sort((a,b) => a.dato.localeCompare(b.dato));
    const kommendeAkt = katAkt.filter(a => (a.datoTil || a.dato) >= iDagStr);
    const tidligereAkt = katAkt.filter(a => (a.datoTil || a.dato) < iDagStr);
    const katOpp = oppgaver.filter(o => {
      const a = aktiviteter.find(a => a.id === o.aktivitetId);
      return a?.type === katId || (!o.aktivitetId && o.kategoriId === katId);
    });

    // Helper: render en leveranse med oppgaver og todos
    function renderAktMedOppgaver(a, seksjon) {
        const erMilepel = a.leveranseType === 'milepæl';
        const d = new Date(a.dato + 'T00:00:00');
        let datoStr = d.getDate() + '. ' + MAANEDER[d.getMonth()];
        if (!erMilepel && a.datoTil && a.datoTil !== a.dato) {
          const dTil = new Date(a.datoTil + 'T00:00:00');
          datoStr += ' – ' + dTil.getDate() + '. ' + MAANEDER[dTil.getMonth()];
        }
        const tidStr = (!erMilepel && a.tid) ? ' · ' + a.tid + (a.tidTil ? '–' + a.tidTil : '') : '';

        const aktEl = document.createElement('div');
        aktEl.className = 'kat-oversikt-akt';
        aktEl.onclick = () => { lukkModal('katOversiktModal'); åpneAktivitetInfo(a.id); };
        aktEl.innerHTML = `<div class="kat-oversikt-akt-tittel">${erMilepel ? '◆ ' : ''}${a.tittel}</div>
          <div class="kat-oversikt-akt-dato">${datoStr}${tidStr}</div>`;
        seksjon.appendChild(aktEl);

        const aktOpp = oppgaver.filter(o => o.aktivitetId === a.id && !o.fullfort);
        aktOpp.forEach(o => {
          const oppEl = document.createElement('div');
          oppEl.className = 'kat-oversikt-oppgave';
          oppEl.onclick = () => { lukkModal('katOversiktModal'); åpneOppgaveInfo(o.id); };
          const fristStr = o.frist ? fristLabel(o.frist, false).tekst : '';
          oppEl.innerHTML = `<span style="color:var(--tekst-sek);">↳</span>
            <span style="flex:1;">${o.beskrivelse}</span>
            ${fristStr ? `<span style="font-size:11px;color:var(--tekst-sek);">${fristStr}</span>` : ''}`;
          const oppTodos = todos.filter(t => t.oppgaveId === o.id);
          if (oppTodos.length > 0) {
            const fullf = oppTodos.filter(t => t.fullfort).length;
            const badge = document.createElement('span');
            badge.style.cssText = 'font-size:10px;color:var(--tekst-sek);white-space:nowrap;';
            badge.textContent = `${fullf}/${oppTodos.length}`;
            oppEl.appendChild(badge);
          }
          seksjon.appendChild(oppEl);

          const oppTodoAktive = todos.filter(t => t.oppgaveId === o.id && !t.fullfort);
          oppTodoAktive.forEach(t => {
            const todoEl = document.createElement('div');
            todoEl.className = 'kat-oversikt-oppgave';
            todoEl.style.paddingLeft = '44px';
            todoEl.style.fontSize = '11px';
            todoEl.onclick = () => { lukkModal('katOversiktModal'); åpneTodoInfo(t.id); };
            todoEl.innerHTML = `<span style="color:var(--grønn-mid);">◻</span> ${t.tittel}`;
            seksjon.appendChild(todoEl);
          });
        });
    }

    // ── Kommende aktiviteter ──
    if (kommendeAkt.length > 0) {
      const seksjon = document.createElement('div');
      seksjon.className = 'kat-oversikt-seksjon';
      const tittel = document.createElement('div');
      tittel.className = 'kat-oversikt-seksjon-tittel';
      tittel.textContent = `Kommende leveranser (${kommendeAkt.length})`;
      seksjon.appendChild(tittel);
      kommendeAkt.forEach(a => renderAktMedOppgaver(a, seksjon));
      body.appendChild(seksjon);
    }

    // ── Frittstående oppgaver ──
    const frittstOpp = katOpp.filter(o => !o.fullfort && !katAkt.find(a => a.id === o.aktivitetId));
    if (frittstOpp.length > 0) {
      const seksjon = document.createElement('div');
      seksjon.className = 'kat-oversikt-seksjon';
      const tittel = document.createElement('div');
      tittel.className = 'kat-oversikt-seksjon-tittel';
      tittel.textContent = 'Øvrige oppgaver';
      seksjon.appendChild(tittel);
      frittstOpp.forEach(o => {
        const oppEl = document.createElement('div');
        oppEl.className = 'kat-oversikt-oppgave';
        oppEl.style.paddingLeft = '12px';
        oppEl.onclick = () => { lukkModal('katOversiktModal'); åpneOppgaveInfo(o.id); };
        const fristStr = o.frist ? fristLabel(o.frist, false).tekst : '';
        oppEl.innerHTML = `<span style="flex:1;">${o.beskrivelse}</span>
          ${fristStr ? `<span style="font-size:11px;color:var(--tekst-sek);">${fristStr}</span>` : ''}`;
        seksjon.appendChild(oppEl);
      });
      body.appendChild(seksjon);
    }

    // ── Tidligere leveranser ──
    if (tidligereAkt.length > 0) {
      const seksjon = document.createElement('div');
      seksjon.className = 'kat-oversikt-seksjon';
      seksjon.style.opacity = '0.6';
      const tittel = document.createElement('div');
      tittel.className = 'kat-oversikt-seksjon-tittel';
      tittel.textContent = `Tidligere leveranser (${tidligereAkt.length})`;
      seksjon.appendChild(tittel);
      tidligereAkt.forEach(a => renderAktMedOppgaver(a, seksjon));
      body.appendChild(seksjon);
    }

    // ── Tom kategori ──
    if (katAkt.length === 0 && katOpp.length === 0) {
      body.innerHTML = '<div style="padding:16px;text-align:center;font-size:13px;color:var(--tekst-sek);">Ingen elementer i denne kategorien.</div>';
    }

    document.getElementById('katOversiktModal').classList.add('vis');
  }

  /* ──────────────────────────────
     TO DO
  ────────────────────────────── */
  let redigTodoId = null;

  /* ── Todo-filter (multi-prosjekt + periode) ── */
  let _todoFilter = { prosjekter: null, periode: null, egStart: null, egSlutt: null };
  // prosjekter: null = bare aktivt, array av id-er = valgte
  // periode: null = alt, '1d','3d','7d','egendefinert'

  function _todoFilterAktiv() {
    return _todoFilter.prosjekter || _todoFilter.periode;
  }

  function _brukTodoFilter() {
    // Avledet: sett prosjekter til null hvis bare aktivt prosjekt uten periodefilter
    const pids = _todoFilter.prosjekter;
    if (pids && pids.length === 1 && pids[0] === aktivtProsjektId && !_todoFilter.periode) {
      _todoFilter.prosjekter = null;
    }
    _oppdaterTodoFilterKnapp();
    renderTodos();
    // Oppdater dagsoversikt-innhold hvis popup er åpen
    const _dpo = document.getElementById('dagsoversiktPopup');
    if (_dpo) _renderDagsoversiktInnhold(_dpo);
  }

  // ── Dagsoversikt-popup (today overview + filter) ──

  function visDagsoversiktPopup(anchorBtn) {
    const existing = document.getElementById('dagsoversiktPopup');
    if (existing) { existing.remove(); return; }

    const popup = document.createElement('div');
    popup.id = 'dagsoversiktPopup';
    popup.className = 'dags-popup';
    popup.addEventListener('click', e => e.stopPropagation());

    // ── Header ──
    const iDag = new Date(); iDag.setHours(0,0,0,0);
    const dagNavn   = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
    const maanedNavn= ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
    const datoTekst = `${dagNavn[iDag.getDay()]} ${iDag.getDate()}. ${maanedNavn[iDag.getMonth()]}`;

    const header = document.createElement('div');
    header.className = 'dags-popup-header';

    const tittelDiv = document.createElement('div');
    tittelDiv.innerHTML = `<div style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--tekst);">I dag</div>
      <div style="font-size:11px;color:var(--tekst-sek);margin-top:1px;">${datoTekst}</div>`;

    header.appendChild(tittelDiv);
    popup.appendChild(header);

    // ── Innhold ──
    _renderDagsoversiktInnhold(popup);

    // Lukk ved klikk utenfor
    setTimeout(() => {
      const lukkHandler = e => {
        if (!popup.contains(e.target) && e.target !== anchorBtn && !anchorBtn.contains(e.target)) {
          popup.remove();
          if (_todoFilter.prosjekter && _todoFilter.prosjekter.length === 0) _todoFilter.prosjekter = null;
          _oppdaterTodoFilterKnapp();
          document.removeEventListener('click', lukkHandler);
        }
      };
      document.addEventListener('click', lukkHandler);
    }, 10);

    anchorBtn.style.position = 'relative';
    anchorBtn.appendChild(popup);
  }

  function _renderDagsoversiktInnhold(popup) {
    const existing = popup.querySelector('.dags-innhold');
    if (existing) existing.remove();

    const iDag    = new Date(); iDag.setHours(0,0,0,0);
    // Bruk lokal dato (ikke UTC) for å unngå tidssone-feil i Norge (UTC+2)
    const _pad    = n => String(n).padStart(2,'0');
    const iDagStr = `${iDag.getFullYear()}-${_pad(iDag.getMonth()+1)}-${_pad(iDag.getDate())}`;
    const fd      = _hentTodoFilterData();

    const forfaltTodos = fd.todos.filter(t => !t.fullfort && t.frist && t.frist < iDagStr)
      .sort((a,b) => a.frist.localeCompare(b.frist));
    const dagsTodos    = fd.todos.filter(t => !t.fullfort && t.frist && t.frist === iDagStr);
    const forfaltOpp   = fd.oppgaver.filter(o => !o.fullfort && o.frist && o.frist < iDagStr)
      .sort((a,b) => a.frist.localeCompare(b.frist));
    const dagsOpp      = fd.oppgaver.filter(o => !o.fullfort && o.frist && o.frist === iDagStr);

    const totalForfalt = forfaltTodos.length + forfaltOpp.length;
    const totalIdag    = dagsTodos.length + dagsOpp.length;

    const innhold = document.createElement('div');
    innhold.className = 'dags-innhold';

    if (totalForfalt === 0 && totalIdag === 0) {
      innhold.innerHTML = `<div style="padding:28px 0;text-align:center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--grønn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:8px;display:block;margin-left:auto;margin-right:auto;"><polyline points="20 6 9 17 4 12"/></svg>
        <div style="font-size:13px;color:var(--tekst-sek);font-weight:600;">Alt er i rute!</div>
        <div style="font-size:11px;color:var(--tekst-sek);margin-top:3px;">Ingen gjøremål for i dag</div>
      </div>`;
    } else {
      // Forfalt
      if (totalForfalt > 0) {
        const sec = document.createElement('div');
        sec.style.marginBottom = '10px';
        const tit = document.createElement('div');
        tit.className = 'dags-seksjon-tittel';
        tit.style.color = '#d94f4f';
        tit.textContent = `Forfalt (${totalForfalt})`;
        sec.appendChild(tit);
        [...forfaltTodos, ...forfaltOpp].forEach(item => sec.appendChild(_lagDagsRad(item, iDag, iDagStr, fd.multi)));
        innhold.appendChild(sec);
      }
      // I dag
      if (totalIdag > 0) {
        const sec = document.createElement('div');
        if (totalForfalt > 0) { sec.style.borderTop = '1px solid var(--kant)'; sec.style.paddingTop = '10px'; }
        const tit = document.createElement('div');
        tit.className = 'dags-seksjon-tittel';
        tit.style.color = 'var(--tekst-sek)';
        tit.textContent = `I dag (${totalIdag})`;
        sec.appendChild(tit);
        [...dagsTodos, ...dagsOpp].forEach(item => sec.appendChild(_lagDagsRad(item, iDag, iDagStr, fd.multi)));
        innhold.appendChild(sec);
      }
    }

    popup.appendChild(innhold);
  }

  function _lagDagsRad(item, iDag, iDagStr, isMulti) {
    const erTodo = 'tittel' in item;
    const pFarge = (isMulti && item._prosjektId)
      ? (prosjekter.find(p => p.id === item._prosjektId)?.farge || 'var(--grønn)')
      : 'var(--grønn)';

    const row = document.createElement('div');
    row.className = 'dags-rad';
    row.onclick = () => { document.getElementById('dagsoversiktPopup')?.remove(); erTodo ? åpneTodoInfo(item.id) : åpneOppgaveInfo(item.id); };

    // Ikon
    const ikon = document.createElement('div');
    ikon.style.flexShrink = '0';
    if (erTodo) {
      ikon.style.cssText = `width:13px;height:13px;border-radius:50%;border:2px solid ${pFarge};flex-shrink:0;`;
    } else {
      ikon.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${pFarge}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><polyline points="9 11 12 14 15 11"/></svg>`;
    }

    // Tekst
    const tekst = document.createElement('div');
    tekst.style.cssText = 'flex:1;font-size:13px;color:var(--tekst);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
    tekst.textContent = erTodo ? (item.tittel || '(uten tittel)') : (item.beskrivelse || '(uten navn)');

    row.appendChild(ikon);
    row.appendChild(tekst);

    // Forfalt-badge
    if (item.frist && item.frist < iDagStr) {
      const diff = Math.round((iDag - new Date(item.frist + 'T00:00:00')) / 86400000);
      const badge = document.createElement('span');
      badge.textContent = diff === 1 ? 'i går' : `${diff}d siden`;
      badge.style.cssText = 'font-size:10px;font-weight:700;color:#d94f4f;background:#fdeaea;padding:2px 7px;border-radius:8px;flex-shrink:0;white-space:nowrap;';
      row.appendChild(badge);
    }

    // Prosjekt-chip (multi)
    if (isMulti && item._prosjektNavn) {
      const chip = document.createElement('span');
      chip.textContent = item._prosjektNavn;
      chip.style.cssText = `font-size:10px;font-weight:700;color:${pFarge};background:${pFarge}22;padding:2px 6px;border-radius:8px;flex-shrink:0;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`;
      row.appendChild(chip);
    }

    return row;
  }

  function _renderFilterSeksjonInnhold(container) {
    container.innerHTML = '';

    if (!_todoFilter.prosjekter) _todoFilter.prosjekter = [aktivtProsjektId];

    // ── Prosjekter ──
    const pTit = document.createElement('div');
    pTit.style.cssText = "font-size:10px;font-weight:700;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:0.8px;color:var(--tekst-sek);margin-bottom:8px;";
    pTit.textContent = 'Prosjekter';
    container.appendChild(pTit);

    prosjekter.forEach(p => {
      const label = document.createElement('label');
      label.style.cssText = 'display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px;color:var(--tekst);font-weight:600;';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = _todoFilter.prosjekter.includes(p.id);
      cb.style.cssText = 'width:15px;height:15px;accent-color:' + (p.farge||'var(--grønn)') + ';cursor:pointer;flex-shrink:0;';
      cb.addEventListener('change', () => {
        if (!_todoFilter.prosjekter) _todoFilter.prosjekter = [aktivtProsjektId];
        if (cb.checked) { if (!_todoFilter.prosjekter.includes(p.id)) _todoFilter.prosjekter.push(p.id); }
        else { _todoFilter.prosjekter = _todoFilter.prosjekter.filter(id => id !== p.id); }
        _brukTodoFilter();
      });
      const dot = document.createElement('span');
      dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:' + (p.farge||'var(--grønn)') + ';flex-shrink:0;';
      const txt = document.createElement('span'); txt.textContent = p.navn;
      label.appendChild(cb); label.appendChild(dot); label.appendChild(txt);
      container.appendChild(label);
    });

    // ── Periode ──
    const perDiv = document.createElement('div');
    perDiv.style.cssText = 'margin-top:10px;border-top:1px solid var(--kant);padding-top:10px;';
    const perTit = document.createElement('div');
    perTit.style.cssText = "font-size:10px;font-weight:700;font-family:'Syne',sans-serif;text-transform:uppercase;letter-spacing:0.8px;color:var(--tekst-sek);margin-bottom:8px;";
    perTit.textContent = 'Periode';
    perDiv.appendChild(perTit);

    const perioder = [
      { val: null, label: 'Alle' },
      { val: '1d',  label: '1 dag' },
      { val: '3d',  label: '3 dager' },
      { val: '7d',  label: '7 dager' },
      { val: 'egendefinert', label: 'Egendefinert' }
    ];
    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;';
    const periodBtns = [];

    const oppdaterPeriodeBtns = () => {
      periodBtns.forEach(({ btn, val }) => {
        const aktiv = _todoFilter.periode === val;
        btn.style.borderColor = aktiv ? 'var(--grønn)' : 'var(--kant)';
        btn.style.background  = aktiv ? 'var(--grønn-lys)' : 'var(--hvil)';
        btn.style.color       = aktiv ? 'var(--grønn)' : 'var(--tekst-sek)';
      });
    };

    const dateRow = document.createElement('div');
    dateRow.style.cssText = 'display:flex;gap:6px;margin-top:8px;';
    dateRow.style.display = _todoFilter.periode === 'egendefinert' ? 'flex' : 'none';

    let renderDebounce = null;
    const makeInput = (val, key) => {
      const inp = document.createElement('input');
      inp.type = 'date'; inp.value = val || '';
      inp.style.cssText = "flex:1;font-size:12px;padding:6px 8px;border:1px solid var(--kant);border-radius:var(--rs);font-family:'Nunito',sans-serif;background:var(--hvit);color:var(--tekst);box-sizing:border-box;";
      inp.oninput = () => {
        _todoFilter[key] = inp.value;
        clearTimeout(renderDebounce);
        renderDebounce = setTimeout(() => _brukTodoFilter(), 300);
      };
      return inp;
    };
    dateRow.appendChild(makeInput(_todoFilter.egStart, 'egStart'));
    dateRow.appendChild(makeInput(_todoFilter.egSlutt, 'egSlutt'));

    perioder.forEach(({ val, label }) => {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.style.cssText = "padding:5px 10px;border-radius:var(--rs);border:1.5px solid var(--kant);background:var(--hvit);color:var(--tekst-sek);font-family:'Syne',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:all .1s;";
      periodBtns.push({ btn, val });
      btn.onclick = () => {
        _todoFilter.periode = val;
        dateRow.style.display = val === 'egendefinert' ? 'flex' : 'none';
        oppdaterPeriodeBtns();
        _brukTodoFilter();
      };
      btnRow.appendChild(btn);
    });
    oppdaterPeriodeBtns();
    perDiv.appendChild(btnRow);
    perDiv.appendChild(dateRow);
    container.appendChild(perDiv);

    // ── Nullstill ──
    const reset = document.createElement('button');
    reset.textContent = 'Nullstill filter';
    reset.style.cssText = "width:100%;margin-top:10px;padding:7px;border:1px solid var(--kant);border-radius:var(--rs);background:var(--hvit);color:var(--tekst-sek);font-family:'Syne',sans-serif;font-weight:700;font-size:11px;cursor:pointer;";
    reset.onclick = () => {
      _todoFilter = { prosjekter: null, periode: null, egStart: null, egSlutt: null };
      _oppdaterTodoFilterKnapp();
      renderTodos();
      // Re-render filter section og innhold
      const fs = document.getElementById('dagsFilterSeksjon');
      if (fs && fs.style.display !== 'none') _renderFilterSeksjonInnhold(fs);
      const popup = document.getElementById('dagsoversiktPopup');
      if (popup) _renderDagsoversiktInnhold(popup);
    };
    container.appendChild(reset);
  }

  function visTodoFilterPopup(anchorBtn) {
    const existing = document.getElementById('todoFilterPopup');
    if (existing) { existing.remove(); _oppdaterTodoFilterKnapp(); return; }

    const popup = document.createElement('div');
    popup.id = 'todoFilterPopup';
    popup.style.cssText = 'position:absolute;top:100%;right:0;z-index:1000;background:var(--hvit);border:1.5px solid var(--kant);border-radius:var(--rs);padding:14px 16px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-top:4px;';
    popup.addEventListener('click', e => e.stopPropagation());

    _renderFilterSeksjonInnhold(popup);

    setTimeout(() => {
      const lukkHandler = e => {
        if (!popup.contains(e.target) && e.target !== anchorBtn && !anchorBtn.contains(e.target)) {
          popup.remove();
          if (_todoFilter.prosjekter && _todoFilter.prosjekter.length === 0) _todoFilter.prosjekter = null;
          _oppdaterTodoFilterKnapp();
          document.removeEventListener('click', lukkHandler);
        }
      };
      document.addEventListener('click', lukkHandler);
    }, 10);

    anchorBtn.style.position = 'relative';
    anchorBtn.appendChild(popup);
  }

  function _oppdaterTodoFilterKnapp() {
    const btn = document.getElementById('todoFilterKnapp');
    if (btn) btn.classList.toggle('aktiv', !!_todoFilterAktiv());
    const dot = document.getElementById('dagsoversiktFilterDot');
    if (dot) dot.style.display = _todoFilterAktiv() ? 'block' : 'none';
  }

  function _hentTodoFilterData() {
    // Returner { todos, oppgaver, aktiviteter, kategorier } basert på filter
    if (!_todoFilter.prosjekter || _todoFilter.prosjekter.length === 0 ||
        (_todoFilter.prosjekter.length === 1 && _todoFilter.prosjekter[0] === aktivtProsjektId)) {
      return { todos, oppgaver, aktiviteter, kategorier, multi: false };
    }
    // Multi-prosjekt: samle data fra alle valgte prosjekter
    let samletTodos = [], samletOppgaver = [], samletAktiviteter = [], samletKategorier = [];
    _todoFilter.prosjekter.forEach(pid => {
      const erAktivt = pid === aktivtProsjektId;
      const data = erAktivt ? { todos, oppgaver, aktiviteter, kategorier } : _hentProsjektData(pid);
      const pNavn = prosjekter.find(p => p.id === pid)?.navn || '';
      // Prefix titler med prosjektnavn for multi-prosjekt
      data.todos.forEach(t => samletTodos.push({ ...t, _prosjektNavn: pNavn, _prosjektId: pid }));
      data.oppgaver.forEach(o => samletOppgaver.push({ ...o, _prosjektNavn: pNavn, _prosjektId: pid }));
      data.aktiviteter.forEach(a => samletAktiviteter.push({ ...a, _prosjektId: pid }));
      data.kategorier.forEach(k => samletKategorier.push({ ...k, _prosjektId: pid }));
    });
    return { todos: samletTodos, oppgaver: samletOppgaver, aktiviteter: samletAktiviteter, kategorier: samletKategorier, multi: true };
  }

  function _todoPassererPeriode(frist) {
    if (!_todoFilter.periode) return true;
    if (!frist) return _todoFilter.periode === null; // uten frist vises bare hvis ingen periodefiler
    const d = new Date(frist + 'T00:00:00');
    const idag = new Date(); idag.setHours(0,0,0,0);
    if (_todoFilter.periode === '1d') {
      const grense = new Date(idag); grense.setDate(grense.getDate() + 1);
      return d <= grense;
    } else if (_todoFilter.periode === '3d') {
      const grense = new Date(idag); grense.setDate(grense.getDate() + 3);
      return d <= grense;
    } else if (_todoFilter.periode === '7d') {
      const grense = new Date(idag); grense.setDate(grense.getDate() + 7);
      return d <= grense;
    } else if (_todoFilter.periode === 'egendefinert') {
      if (_todoFilter.egStart && frist < _todoFilter.egStart) return false;
      if (_todoFilter.egSlutt && frist > _todoFilter.egSlutt) return false;
      return true;
    }
    return true;
  }

  /* ── Prosjektfilter for leveranser og oppgaver ── */
  let _leveranseFilter = { prosjekter: null };
  let _oppgaveFilter   = { prosjekter: null };

  function _getTabFilter(tab) {
    return tab === 'leveranse' ? _leveranseFilter : _oppgaveFilter;
  }

  function _tabFilterAktiv(tab) {
    return !!_getTabFilter(tab).prosjekter;
  }

  function _oppdaterTabFilterKnapp(tab) {
    const id = tab === 'leveranse' ? 'leveranseFilterKnapp' : 'oppgaveFilterKnapp';
    const btn = document.getElementById(id);
    if (btn) btn.classList.toggle('aktiv', _tabFilterAktiv(tab));
  }

  function _brukTabFilter(tab) {
    const f = _getTabFilter(tab);
    if (f.prosjekter && f.prosjekter.length === 1 && f.prosjekter[0] === aktivtProsjektId) {
      f.prosjekter = null;
    }
    _oppdaterTabFilterKnapp(tab);
    if (tab === 'leveranse') renderListe();
    else renderOppgaver();
  }

  function _hentTabFilterData(tab) {
    const f = _getTabFilter(tab);
    if (!f.prosjekter || f.prosjekter.length === 0 ||
        (f.prosjekter.length === 1 && f.prosjekter[0] === aktivtProsjektId)) {
      return { aktiviteter, oppgaver, kategorier, multi: false };
    }
    let sA = [], sO = [], sK = [];
    f.prosjekter.forEach(pid => {
      const erAktivt = pid === aktivtProsjektId;
      const data = erAktivt ? { aktiviteter, oppgaver, kategorier } : _hentProsjektData(pid);
      const pNavn = prosjekter.find(p => p.id === pid)?.navn || '';
      data.aktiviteter.forEach(a => sA.push({ ...a, _prosjektNavn: pNavn, _prosjektId: pid }));
      data.oppgaver.forEach(o => sO.push({ ...o, _prosjektNavn: pNavn, _prosjektId: pid }));
      data.kategorier.forEach(k => { if (!sK.find(x => x.id === k.id && x._prosjektId === pid)) sK.push({ ...k, _prosjektId: pid }); });
    });
    return { aktiviteter: sA, oppgaver: sO, kategorier: sK, multi: true };
  }

  function visProsjektFilterPopup(anchorBtn, tab) {
    const popupId = tab + 'FilterPopup';
    const existing = document.getElementById(popupId);
    if (existing) { existing.remove(); _oppdaterTabFilterKnapp(tab); return; }

    const f = _getTabFilter(tab);
    if (!f.prosjekter) f.prosjekter = [aktivtProsjektId];

    const popup = document.createElement('div');
    popup.id = popupId;
    popup.style.cssText = 'position:absolute;top:100%;right:0;z-index:1000;background:var(--hvit);border:1.5px solid var(--kant);border-radius:var(--rs);padding:14px 16px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-top:4px;';
    popup.addEventListener('click', e => e.stopPropagation());

    const pTittel = document.createElement('div');
    pTittel.style.cssText = 'font-size:10px;font-weight:700;font-family:\'Syne\',sans-serif;text-transform:uppercase;letter-spacing:0.8px;color:var(--tekst-sek);margin-bottom:8px;';
    pTittel.textContent = 'Prosjekter';
    popup.appendChild(pTittel);

    prosjekter.forEach(p => {
      const label = document.createElement('label');
      label.style.cssText = 'display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:13px;color:var(--tekst);font-weight:600;';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = f.prosjekter.includes(p.id);
      cb.style.cssText = 'width:16px;height:16px;accent-color:' + (p.farge || 'var(--grønn)') + ';cursor:pointer;flex-shrink:0;';
      cb.addEventListener('change', () => {
        if (!f.prosjekter) f.prosjekter = [aktivtProsjektId];
        if (cb.checked) { if (!f.prosjekter.includes(p.id)) f.prosjekter.push(p.id); }
        else { f.prosjekter = f.prosjekter.filter(id => id !== p.id); }
        _brukTabFilter(tab);
      });
      const dot = document.createElement('span');
      dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:' + (p.farge || 'var(--grønn)') + ';flex-shrink:0;';
      const txt = document.createElement('span');
      txt.textContent = p.navn;
      label.appendChild(cb);
      label.appendChild(dot);
      label.appendChild(txt);
      popup.appendChild(label);
    });

    // Nullstill
    const reset = document.createElement('button');
    reset.textContent = 'Nullstill filter';
    reset.style.cssText = 'width:100%;margin-top:12px;padding:8px;border:1px solid var(--kant);border-radius:var(--rs);background:var(--hvit);color:var(--tekst-sek);font-family:\'Syne\',sans-serif;font-weight:700;font-size:11px;cursor:pointer;';
    reset.onclick = () => {
      if (tab === 'leveranse') _leveranseFilter = { prosjekter: null };
      else _oppgaveFilter = { prosjekter: null };
      popup.remove();
      _oppdaterTabFilterKnapp(tab);
      if (tab === 'leveranse') renderListe(); else renderOppgaver();
    };
    popup.appendChild(reset);

    // Lukk utenfor
    setTimeout(() => {
      const lukkHandler = e => {
        if (!popup.contains(e.target) && e.target !== anchorBtn && !anchorBtn.contains(e.target)) {
          popup.remove();
          if (f.prosjekter && f.prosjekter.length === 0) f.prosjekter = null;
          _oppdaterTabFilterKnapp(tab);
          document.removeEventListener('click', lukkHandler);
        }
      };
      document.addEventListener('click', lukkHandler);
    }, 10);

    anchorBtn.appendChild(popup);
  }

  function renderTodos() {
    renderKatOversiktKnapper();
    const container = document.getElementById('todoListe');
    if (!container) return;
    container.innerHTML = '';

    const iDag  = new Date(); iDag.setHours(0,0,0,0);
    const om30  = new Date(iDag); om30.setDate(om30.getDate() + 30);

    // Hent data (kan være multi-prosjekt via filter)
    const fd = _hentTodoFilterData();
    const fTodos = fd.todos;
    const fOppgaver = fd.oppgaver;
    const fAktiviteter = fd.aktiviteter;
    const isMulti = fd.multi;
    const harPeriodeFilter = !!_todoFilter.periode;

    // Hovedfilter-hjelpefunksjon for todos
    const todoPasserer = t => matcherGlobalFilter(null, t.kategoriId, null) ||
      (t.oppgaveId && matcherGlobalFilter(null, fOppgaver.find(o => o.id === t.oppgaveId)?.kategoriId, fOppgaver.find(o => o.id === t.oppgaveId)?.aktivitetId));
    const oppPasserer = o => matcherGlobalFilter(null, o.kategoriId, o.aktivitetId);

    // Todos uten frist (aktive) — vis kun hvis ingen periode-filter
    const utenFrist = fTodos.filter(t => !t.fullfort && !t.frist && (!globalKatFilter || isMulti || todoPasserer(t)) && !harPeriodeFilter);

    // Todos med frist (aktive), sortert + periodefilter
    const medFrist = fTodos.filter(t => !t.fullfort && t.frist && (!globalKatFilter || isMulti || todoPasserer(t)) && _todoPassererPeriode(t.frist))
      .sort((a,b) => a.frist.localeCompare(b.frist));

    // Oppgaver med frist (ikke fullført) — bruk periodefiler eller 30-dagers default
    const oppgaverSnart = fOppgaver.filter(o => {
      if (o.fullfort || !o.frist) return false;
      if (!isMulti && globalKatFilter && !oppPasserer(o)) return false;
      if (harPeriodeFilter) return _todoPassererPeriode(o.frist);
      const d = new Date(o.frist + 'T00:00:00');
      return d <= om30;
    }).sort((a,b) => a.frist.localeCompare(b.frist));

    // Fullførte todos — skjul ved periodefilter
    const fullforte = harPeriodeFilter ? [] : fTodos.filter(t => t.fullfort && (!globalKatFilter || isMulti || todoPasserer(t)));

    const tomListe = utenFrist.length === 0 && medFrist.length === 0 &&
                     oppgaverSnart.length === 0 && fullforte.length === 0;
    if (tomListe) {
      const tom = document.createElement('div');
      tom.style.cssText = 'padding:24px;text-align:center;font-size:13px;color:var(--tekst-sek);';
      tom.textContent = 'Ingen to do-elementer ennå.';
      container.appendChild(tom);
      return;
    }

    // Helper: render a todo item
    const lagTodoKort = t => {
      const ytre = document.createElement('div');
      ytre.style.cssText = 'position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:1px;';

      const slettBg = document.createElement('div');
      slettBg.className = 'sveip-bakgrunn';
      slettBg.innerHTML = `<div class="slett-sirkel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></div>`;

      const wrapper = document.createElement('div');
      wrapper.className = 'sveip-innhold';

      const kort = document.createElement('div');
      kort.className = 'todo-kort' + (t.fullfort ? ' fullfort' : '');
      kort.onclick = () => åpneTodoInfo(t.id);

      const cb = document.createElement('div');
      cb.className = 'todo-cb' + (t.fullfort ? ' sjekket' : '');
      cb.innerHTML = t.fullfort ? '<svg width="9" height="9" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
      cb.onclick = e => { e.stopPropagation(); toggleTodo(t.id); };

      let metaHtml = '';
      if (isMulti && t._prosjektNavn) {
        const pFarge = prosjekter.find(p => p.id === t._prosjektId)?.farge || 'var(--grønn)';
        metaHtml += `<span class="tilknyttet-chip" style="border-color:${pFarge};color:${pFarge};font-size:10px;">${t._prosjektNavn}</span>`;
      }
      if (t.frist) metaHtml += fristSpan(t.frist, t.fullfort);
      if (t.oppgaveId) {
        const opp = fOppgaver.find(o => o.id === t.oppgaveId);
        if (opp) metaHtml += `<span class="tilknyttet-chip chip-fri" style="border-color:var(--grønn-mid);color:var(--tekst-sek);">${opp.beskrivelse}</span>`;
      }
      if (t.kategoriId) {
        const katT = getKat(t.kategoriId);
        if (katT) metaHtml += `<span class="tilknyttet-chip chip-${katT.id}">${katT.label}</span>`;
      }

      const info = document.createElement('div');
      info.className = 'todo-info';
      info.innerHTML = `<div class="todo-tittel">${t.tittel}</div>
        ${metaHtml ? '<div class="todo-meta">' + metaHtml + '</div>' : ''}`;

      kort.appendChild(cb);
      kort.appendChild(info);
      wrapper.appendChild(kort);
      ytre.appendChild(slettBg);
      ytre.appendChild(wrapper);
      leggTilSveipSlett(ytre, wrapper, slettBg, () => {
        todos = todos.filter(x => x.id !== t.id);
        lagre(); renderTodos();
      });
      return ytre;
    };

    // Helper: render an oppgave as a compact row
    const lagOppgaveKort = o => {
      const ytre = document.createElement('div');
      ytre.style.cssText = 'position:relative;overflow:hidden;border-radius:var(--r);margin-bottom:1px;';

      const slettBg = document.createElement('div');
      slettBg.className = 'sveip-bakgrunn';
      slettBg.innerHTML = `<div class="slett-sirkel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></div>`;

      const wrapper = document.createElement('div');
      wrapper.className = 'sveip-innhold';

      const akt = o.aktivitetId ? fAktiviteter.find(a => a.id === o.aktivitetId) : null;
      const oType = akt?.type || o.kategoriId;
      const stripeKlasse = oType ? 'stripe-' + oType : 'stripe-fri';

      const kort = document.createElement('div');
      kort.className = 'todo-kort' + (o.fullfort ? ' fullfort' : '');
      kort.style.borderLeft = `3px solid ${getKat(oType)?.farge || 'var(--grønn-mid)'}`;
      kort.style.cursor = 'pointer';
      kort.onclick = () => åpneOppgaveInfo(o.id);

      const cb = document.createElement('div');
      cb.className = 'todo-cb' + (o.fullfort ? ' sjekket' : '');
      cb.innerHTML = o.fullfort ? '<svg width="9" height="9" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '';
      cb.onclick = e => { e.stopPropagation(); toggleOppgave(o.id); renderTodos(); };

      let metaHtml = '';
      if (isMulti && o._prosjektNavn) {
        const pFarge = prosjekter.find(p => p.id === o._prosjektId)?.farge || 'var(--grønn)';
        metaHtml += `<span class="tilknyttet-chip" style="border-color:${pFarge};color:${pFarge};font-size:10px;">${o._prosjektNavn}</span>`;
      }
      metaHtml += fristSpan(o.frist, o.fullfort);
      if (akt) {
        metaHtml += `<span class="tilknyttet-chip chip-${akt.type || "fri"}">${akt.tittel}</span>`;
      } else if (o.kategoriId) {
        const katO = getKat(o.kategoriId);
        if (katO) metaHtml += `<span class="tilknyttet-chip chip-${katO.id}">${katO.label}</span>`;
      }

      const info = document.createElement('div');
      info.className = 'todo-info';
      info.innerHTML = `<div class="todo-tittel">${o.beskrivelse}</div>
        ${metaHtml ? '<div class="todo-meta">' + metaHtml + '</div>' : ''}`;

      kort.appendChild(cb);
      kort.appendChild(info);
      wrapper.appendChild(kort);
      ytre.appendChild(slettBg);
      ytre.appendChild(wrapper);
      leggTilSveipSlett(ytre, wrapper, slettBg, () => {
        oppgaver = oppgaver.filter(x => x.id !== o.id);
        lagre(); renderTodos();
      });
      return ytre;
    };

    const lagSeksjon = label => {
      const ml = document.createElement('div');
      ml.className = 'maaned-label';
      ml.textContent = label;
      container.appendChild(ml);
    };

    // 1. Uten frist
    if (utenFrist.length > 0) {
      lagSeksjon('Ingen frist');
      utenFrist.forEach(t => container.appendChild(lagTodoKort(t)));
    }

    // 2. Med frist — todos og oppgaver interleaved by date, grouped by month
    const allemedFrist = [
      ...medFrist.map(t => ({ dato: t.frist, type: 'todo', item: t })),
      ...oppgaverSnart.map(o => ({ dato: o.frist, type: 'opp', item: o }))
    ].sort((a,b) => a.dato.localeCompare(b.dato));

    let sistMnd = null;
    allemedFrist.forEach(({ dato, type, item }) => {
      const d = new Date(dato + 'T00:00:00');
      const mnd = MAANEDER[d.getMonth()] + ' ' + d.getFullYear();
      if (mnd !== sistMnd) { lagSeksjon(mnd); sistMnd = mnd; }
      container.appendChild(type === 'todo' ? lagTodoKort(item) : lagOppgaveKort(item));
    });

    // 3. Fullførte (todos + oppgaver)
    const fullforteOpp = harPeriodeFilter ? [] : fOppgaver.filter(o => o.fullfort);
    if (fullforte.length > 0 || fullforteOpp.length > 0) {
      lagSeksjon('Fullført');
      fullforte.forEach(t => container.appendChild(lagTodoKort(t)));
      fullforteOpp.forEach(o => container.appendChild(lagOppgaveKort(o)));
    }
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) {
      t.fullfort = !t.fullfort;
      t.fullfortDato = t.fullfort ? new Date().toISOString().slice(0,10) : null;
      lagre(); renderTodos();
    }
  }

  function settTodoFrist(dager) {
    const d = new Date();
    d.setDate(d.getDate() + dager);
    document.getElementById('todoFeltFrist').value = d.toISOString().slice(0, 10);
  }

  function synkTodoFraOppgave(oppgaveId) {
    if (!oppgaveId) return;
    const o = oppgaver.find(o => o.id === oppgaveId);
    if (!o) return;
    if (o.kategoriId) document.getElementById('todoFeltKategori').value = o.kategoriId;
    if (o.aktivitetId) {
      document.getElementById('todoFeltLeveranse').value = o.aktivitetId;
      if (!o.kategoriId) {
        const lev = aktiviteter.find(a => a.id === o.aktivitetId);
        if (lev?.type) document.getElementById('todoFeltKategori').value = lev.type;
      }
    }
  }

  // ── Kaskaderende dropdown-hjelpere ──

  // Fyller leveranse-select i todo-modal filtrert på valgt kategori.
  // keepId: verdi som forsøkes gjenopprettet etter re-fylling.
  function _oppdaterTodoLevSelect(keepId) {
    const katId = document.getElementById('todoFeltKategori').value;
    const levSel = document.getElementById('todoFeltLeveranse');
    const restore = keepId !== undefined ? keepId : levSel.value;
    levSel.innerHTML = '<option value="">— Ingen —</option>';
    [...aktiviteter]
      .filter(a => !katId || a.type === katId)
      .sort((a, b) => a.dato.localeCompare(b.dato))
      .forEach(a => {
        const kat = getKat(a.type);
        const opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = (a.leveranseType === 'milepæl' ? '◆ ' : '') + a.tittel
          + (!katId && kat ? ` [${kat.label}]` : '');
        levSel.appendChild(opt);
      });
    levSel.value = restore;
    if (levSel.value !== restore) levSel.value = ''; // filtrert bort
  }

  // Fyller oppgave-select i todo-modal filtrert på valgt leveranse og/eller kategori.
  function _oppdaterTodoOppSelect(keepId) {
    const levId = document.getElementById('todoFeltLeveranse').value;
    const katId = document.getElementById('todoFeltKategori').value;
    const sel = document.getElementById('todoFeltOppgave');
    const restore = keepId !== undefined ? keepId : sel.value;
    sel.innerHTML = '<option value="">— Ingen —</option>';
    oppgaver
      .filter(o => {
        if (o.fullfort) return false;
        if (levId) return o.aktivitetId === levId;
        if (katId) {
          if (o.kategoriId === katId) return true;
          const akt = o.aktivitetId ? aktiviteter.find(a => a.id === o.aktivitetId) : null;
          return akt?.type === katId;
        }
        return true; // ingen filter: vis alle
      })
      .forEach(o => {
        const akt = o.aktivitetId ? aktiviteter.find(a => a.id === o.aktivitetId) : null;
        const opt = document.createElement('option');
        opt.value = o.id;
        opt.textContent = o.beskrivelse + (akt && !levId ? ` (${akt.tittel})` : '');
        sel.appendChild(opt);
      });
    sel.value = restore;
    if (sel.value !== restore) sel.value = '';
  }

  // Fyller leveranse-select i oppgave-modal filtrert på valgt kategori.
  function _oppdaterOppLevSelect(keepId) {
    const katId = document.getElementById('oppFeltKategori').value;
    const sel = document.getElementById('oppFeltAktivitet');
    const restore = keepId !== undefined ? keepId : sel.value;
    const iDagStr = new Date().toISOString().slice(0, 10);
    sel.innerHTML = '<option value="">— Frittstående —</option>';
    [...aktiviteter]
      .filter(a => {
        if (katId && a.type !== katId) return false;
        return (a.datoTil || a.dato) >= iDagStr || a.id === restore;
      })
      .sort((a, b) => a.dato.localeCompare(b.dato))
      .forEach(a => {
        const d = new Date(a.dato + 'T00:00:00');
        const kat = getKat(a.type);
        const opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = (a.leveranseType === 'milepæl' ? '◆ ' : '') + a.tittel
          + `  (${d.getDate()}. ${MAANEDER[d.getMonth()]})`
          + (!katId && kat ? ` [${kat.label}]` : '');
        sel.appendChild(opt);
      });
    sel.value = restore;
    if (sel.value !== restore) sel.value = '';
  }

    redigTodoId = id;
    const slettKnapp = document.getElementById('slettTodoKnapp');

    // Fyll kategori-select (alltid alle kategorier – ingen filter her)

        // Pre-fill fra leveranse: sett kategori, vis kun oppgaver i denne leveransen

        todoKatSelect.value = preLev?.type || '';
        _oppdaterTodoLevSelect(preLeveranseId);
        _oppdaterTodoOppSelect('');
      } else {

        todoKatSelect.value = '';
        _oppdaterTodoLevSelect('');
        _oppdaterTodoOppSelect('');

      const t = todos.find(t => t.id === redigTodoId);
      if (t) { t.tittel = tittel; t.beskrivelse = besk; t.frist = frist; t.aktivitetId = aktivitetId; t.oppgaveId = oppgaveId; t.kategoriId = kategoriId; }

      todos.push({ id: uid(), tittel, beskrivelse: besk, frist, aktivitetId, oppgaveId, kategoriId, fullfort: false });

    const antall = aktiviteter.filter(a => a.type === id).length +
                   oppgaver.filter(o => {
                     const a = aktiviteter.find(a => a.id === o.aktivitetId);
                     return a?.type === id;
                   }).length;
    const msg = antall > 0
      ? `Slett kategorien «${k.label}»?\n\n${antall} element(er) vil miste kategoritilknytningen.`
      : `Slett kategorien «${k.label}»?`;

    aktiviteter.forEach(a => { if (a.type === id) a.type = null; });

    delete aktivitetFilterState[id];
    delete oppgaveFilterState[id];
    lagreFilterState(_pk('fa'), aktivitetFilterState);
    lagreFilterState(_pk('fo'), oppgaveFilterState);
    genererKategoriCSS();
    lagre();
    renderKategoriModal();
    oppdaterAktivPanel();
  }

  /* ──────────────────────────────

  ────────────────────────────── */
  function fristLabel(fristStr, fullfort = false) {
    if (!fristStr) return null;
    const iDag  = new Date(); iDag.setHours(0,0,0,0);
    const fd    = new Date(fristStr + 'T00:00:00');
    const diff  = Math.round((fd - iDag) / 86400000);
    const datoStr = fd.getDate() + '. ' + MAANEDER[fd.getMonth()];

    if (!fullfort && diff < 0)   return { tekst: `⚠ ${Math.abs(diff)} dag${Math.abs(diff)===1?'':'er'} over`,  farge: '#c0392b', vekt: '700' };
    if (!fullfort && diff === 0) return { tekst: 'I dag!',              farge: '#d48826', vekt: '700' };
    if (!fullfort && diff === 1) return { tekst: 'I morgen',            farge: '#d48826', vekt: '600' };
    if (!fullfort && diff <= 6)  return { tekst: `Om ${diff} dager`,    farge: 'var(--tekst-sek)', vekt: '500' };
    return { tekst: datoStr, farge: 'var(--tekst-sek)', vekt: '500' };
  }

  function fristSpan(fristStr, fullfort = false) {
    const lbl = fristLabel(fristStr, fullfort);
    if (!lbl) return '';
    return `<span class="frist-tekst" style="color:${lbl.farge};font-weight:${lbl.vekt};">${lbl.tekst}</span>`;
  }

  /* ──────────────────────────────
     SVEIP FOR Å SLETTE
  ────────────────────────────── */
  function leggTilSveipSlett(container, innhold, bakgrunn, onSlett) {
    const TERSKEL = 90;
    let startX = 0, startY = 0, dx = 0, sveiper = false, retningBestemt = false;

    innhold.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      dx = 0; sveiper = false; retningBestemt = false;
      innhold.classList.add('ingen-trans');
    }, { passive: true });

    innhold.addEventListener('touchmove', e => {
      const curX = e.touches[0].clientX;
      const curY = e.touches[0].clientY;
      const diffX = curX - startX;
      const diffY = curY - startY;

      if (!retningBestemt) {
        if (Math.abs(diffX) < 5 && Math.abs(diffY) < 5) return;
        retningBestemt = true;
        sveiper = Math.abs(diffX) > Math.abs(diffY) && diffX < 0;
      }
      if (!sveiper) return;
      e.preventDefault();
      dx = Math.min(0, diffX);
      innhold.style.transform = `translateX(${dx}px)`;
      // Vis sirkelen når vi har dratt nok
      if (dx < -30) bakgrunn.classList.add('vis');
      else bakgrunn.classList.remove('vis');
    }, { passive: false });

    innhold.addEventListener('touchend', () => {
      innhold.classList.remove('ingen-trans');
      if (dx < -TERSKEL) {
        innhold.style.transform = `translateX(-100%)`;
        innhold.style.opacity = '0';
        innhold.style.transition = 'transform 0.2s ease, opacity 0.2s';
        container.style.transition = 'max-height 0.25s ease, opacity 0.25s, padding 0.25s';
        container.style.maxHeight = container.offsetHeight + 'px';
        setTimeout(() => {
          container.style.maxHeight = '0';
          container.style.overflow = 'hidden';
          container.style.opacity = '0';
        }, 150);
        setTimeout(onSlett, 380);
      } else {
        innhold.style.transform = 'translateX(0)';
        bakgrunn.classList.remove('vis');
        dx = 0;
      }
    });
  }
