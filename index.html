  /* ──────────────────────────────
     IMPORT / EKSPORT
  ────────────────────────────── */
  function eksporterData() {
    // Lagre nåværende prosjekt først
    lagre();
    // Eksporter alle prosjekter
    const alleProsjekter = prosjekter.map(p => {
      const pk = s => 'lp_' + p.id + '_' + s;
      return {
        id: p.id, navn: p.navn, farge: p.farge, opprettet: p.opprettet,
        aktiviteter: JSON.parse(localStorage.getItem(pk('a')) || '[]'),
        oppgaver:    JSON.parse(localStorage.getItem(pk('o')) || '[]'),
        todos:       JSON.parse(localStorage.getItem(pk('t')) || '[]'),
        kategorier:  JSON.parse(localStorage.getItem(pk('k')) || '[]'),
        tidslinjeGrenser: JSON.parse(localStorage.getItem(pk('tl')) || '{}')
      };
    });
    const payload = {
      versjon: '3.0',
      eksportert: new Date().toISOString(),
      aktivtProsjekt: aktivtProsjektId,
      prosjekter: alleProsjekter,
      // Bakoverkompatibel: inkluder aktivt prosjekts data på toppnivå
      aktiviteter, oppgaver, todos, kategorier
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const el   = document.createElement('a');
    el.href     = url;
    const aktivtNavn = prosjekter.find(p => p.id === aktivtProsjektId)?.navn || 'prosjekt';
    el.download = aktivtNavn.replace(/\s+/g, '-').toLowerCase() + '-alle-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(el);
    el.click();
    document.body.removeChild(el);
    URL.revokeObjectURL(url);
  }

  // Snapshot for angre-funksjon
  let importSnapshot = null;

  function taSnapshot() {
    importSnapshot = {
      aktiviteter: JSON.parse(JSON.stringify(aktiviteter)),
      oppgaver:    JSON.parse(JSON.stringify(oppgaver)),
      todos:       JSON.parse(JSON.stringify(todos)),
      kategorier:  JSON.parse(JSON.stringify(kategorier))
    };
    document.getElementById('angreImportKnapp').style.display = 'inline-flex';
  }

  function angreImport() {
    if (!importSnapshot) return;
    if (!confirm('Angre siste import/merge og gå tilbake til forrige tilstand?')) return;
    aktiviteter = importSnapshot.aktiviteter;
    oppgaver    = importSnapshot.oppgaver;
    todos       = importSnapshot.todos;
    kategorier  = importSnapshot.kategorier || kategorier;
    importSnapshot = null;
    document.getElementById('angreImportKnapp').style.display = 'none';
    genererKategoriCSS();
    lagre(); oppdaterAktivPanel();
    if (valgtDato) renderValgtDag(valgtDato);
    alert('✓ Import angret.');
  }

  function importerData(input) {
    const fil = input.files[0];
    if (!fil) return;
    const leser = new FileReader();
    leser.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        // Ny multi-prosjekt format (v3.0)
        if (data.versjon === '3.0' && Array.isArray(data.prosjekter)) {
          const bekreft = confirm(
            'Importere ' + data.prosjekter.length + ' prosjekt(er)? Dette vil erstatte alle eksisterende data.\n\nFortsette?'
          );
          if (!bekreft) return;
          taSnapshot();
          // Importer alle prosjekter
          data.prosjekter.forEach(p => {
            const pk = s => 'lp_' + p.id + '_' + s;
            localStorage.setItem(pk('a'), JSON.stringify(p.aktiviteter || []));
            localStorage.setItem(pk('o'), JSON.stringify(p.oppgaver || []));
            localStorage.setItem(pk('t'), JSON.stringify(p.todos || []));
            localStorage.setItem(pk('k'), JSON.stringify(p.kategorier || []));
            if (p.tidslinjeGrenser) localStorage.setItem(pk('tl'), JSON.stringify(p.tidslinjeGrenser));
          });
          prosjekter = data.prosjekter.map(p => ({ id: p.id, navn: p.navn, farge: p.farge, opprettet: p.opprettet }));
          localStorage.setItem('lp_prosjekter', JSON.stringify(prosjekter));
          // Bytt til aktivt prosjekt fra eksporten
          const målId = data.aktivtProsjekt || prosjekter[0].id;
          aktivtProsjektId = målId;
          localStorage.setItem('lp_aktivt_prosjekt', målId);
          hent();
          const p = prosjekter.find(p => p.id === målId);
          if (p) settProsjektFarger(p.farge);
          oppdaterProsjektTittel();
          genererKategoriCSS();
          renderHovedFilter(); oppdaterAktivPanel(); renderTodos();
          if (kalVisning === 'tidslinje') renderTidslinje();
          alert('✓ ' + data.prosjekter.length + ' prosjekt(er) importert.');
        } else if (Array.isArray(data.aktiviteter) && Array.isArray(data.oppgaver)) {
          // Gammel format – importer til nåværende prosjekt
          const bekreft = confirm(
            'Dette vil erstatte alle eksisterende leveranser og oppgaver i nåværende prosjekt med dataene fra filen.\n\nFortsette?'
          );
          if (!bekreft) return;
          taSnapshot();
          aktiviteter = data.aktiviteter;
          oppgaver    = data.oppgaver;
          todos       = data.todos || todos;
          if (data.kategorier?.length) kategorier = data.kategorier;
          genererKategoriCSS();
          lagre();
          renderHovedFilter(); oppdaterAktivPanel(); renderTodos();
          if (kalVisning === 'tidslinje') renderTidslinje();
          alert('✓ Data importert til nåværende prosjekt.');
        } else {
          alert('Filen ser ikke ut til å være en gyldig eksport.');
        }
      } catch {
        alert('Kunne ikke lese filen. Sjekk at det er en gyldig .json-fil.');
      }
    };
    leser.readAsText(fil);
    input.value = '';
  }

  function mergeData(input) {
    const fil = input.files[0];
    if (!fil) return;
    const leser = new FileReader();
    leser.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!Array.isArray(data.aktiviteter) || !Array.isArray(data.oppgaver)) {
          alert('Filen ser ikke ut til å være en gyldig Prosjekter-eksport.'); return;
        }

        // Merge: legg til kun elementer med nye IDer
        const eksisterendeAktId = new Set(aktiviteter.map(a => a.id));
        const eksisterendeOppId = new Set(oppgaver.map(o => o.id));
        const eksisterendeTodId = new Set(todos.map(t => t.id));

        const nyeAkt = data.aktiviteter.filter(a => !eksisterendeAktId.has(a.id));
        const nyeOpp = data.oppgaver.filter(o => !eksisterendeOppId.has(o.id));
        const nyeTod = (data.todos || []).filter(t => !eksisterendeTodId.has(t.id));

        // Merge kategorier: legg til nye, oppdater eksisterende
        const nyeKat = [];
        if (data.kategorier?.length) {
          data.kategorier.forEach(importK => {
            const eksK = kategorier.find(k => k.id === importK.id);
            if (eksK) { eksK.label = importK.label; eksK.farge = importK.farge; }
            else nyeKat.push(importK);
          });
        }

        if (nyeAkt.length === 0 && nyeOpp.length === 0 && nyeTod.length === 0 && nyeKat.length === 0) {
          alert('Ingen nye elementer å legge til — alt fantes fra før.');
          return;
        }

        taSnapshot();
        aktiviteter = [...aktiviteter, ...nyeAkt];
        oppgaver    = [...oppgaver,    ...nyeOpp];
        todos       = [...todos,       ...nyeTod];
        kategorier  = [...kategorier,  ...nyeKat];
        genererKategoriCSS();

        lagre();
        renderHovedFilter();
        oppdaterAktivPanel();
        renderTodos();
        if (kalVisning === 'tidslinje') renderTidslinje();
        alert(`✓ Slått sammen: ${nyeAkt.length} leveranser, ${nyeOpp.length} oppgaver, ${nyeTod.length} todos, ${nyeKat.length} kategorier lagt til.`);
      } catch {
        alert('Kunne ikke lese filen. Sjekk at det er en gyldig .json-fil.');
      }
    };
    leser.readAsText(fil);
    input.value = '';
  }
  /* ──────────────────────────────
     UKENTLIG OPPSUMMERING
  ────────────────────────────── */
  let rapportPeriode = 'uke'; // 'uke' | 'maaned' | 'kvartal' | 'egendefinert'
  let rapportEgendefinertStart = null;
  let rapportEgendefinertSlutt = null;

  // Rapport-kontekst: lagrer data slik at periodebytte fungerer
  let _rapportKontekst = null; // { aktiviteter, oppgaver, todos, kategorier, katFilter, tittel, undertittel }

  function _reRenderRapport() {
    if (!_rapportKontekst) {
      åpneRapport(window._aktivRapportKatFilter || null, true);
      return;
    }
    // Swap inn lagret data
    const bak = { aktiviteter, oppgaver, todos, kategorier };
    aktiviteter = _rapportKontekst.aktiviteter;
    oppgaver = _rapportKontekst.oppgaver;
    todos = _rapportKontekst.todos;
    kategorier = _rapportKontekst.kategorier;
    genererKategoriCSS();
    åpneRapport(_rapportKontekst.katFilter, true);
    // Gjenopprett titler
    if (_rapportKontekst.tittel) {
      document.querySelector('#rapportModal .modal-tittel').textContent = _rapportKontekst.tittel;
    }
    if (_rapportKontekst.undertittel) {
      const el = document.querySelector('.rapport-tittel-stor');
      if (el) el.innerHTML = _rapportKontekst.undertittel;
    }
    // Swap tilbake
    aktiviteter = bak.aktiviteter;
    oppgaver = bak.oppgaver;
    todos = bak.todos;
    kategorier = bak.kategorier;
    genererKategoriCSS();
  }

  function byttRapportPeriode(periode, btn) {
    rapportPeriode = periode;
    document.querySelectorAll('.rapportPeriodeKnapp').forEach(b => b.classList.remove('aktiv'));
    if (btn) btn.classList.add('aktiv');
    const egenSpan = document.getElementById('rapportEgendefinertDatoer');
    if (egenSpan) egenSpan.style.display = periode === 'egendefinert' ? 'flex' : 'none';
    if (periode !== 'egendefinert') {
      _reRenderRapport();
    }
  }

  function visEgendefinertPeriode(btn) {
    document.querySelectorAll('.rapportPeriodeKnapp').forEach(b => b.classList.remove('aktiv'));
    btn.classList.add('aktiv');
    rapportPeriode = 'egendefinert';
    const egenSpan = document.getElementById('rapportEgendefinertDatoer');
    egenSpan.style.display = 'flex';
    const startInput = document.getElementById('rapportEgenStart');
    const sluttInput = document.getElementById('rapportEgenSlutt');
    if (!startInput.value) {
      const d = new Date();
      startInput.value = new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
      sluttInput.value = new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().slice(0,10);
    }
    oppdaterEgendefinertPeriode();
  }

  function oppdaterEgendefinertPeriode() {
    const s = document.getElementById('rapportEgenStart').value;
    const e = document.getElementById('rapportEgenSlutt').value;
    if (s && e) {
      rapportEgendefinertStart = s;
      rapportEgendefinertSlutt = e;
      rapportPeriode = 'egendefinert';
      _reRenderRapport();
    }
  }

  function beregnRapportData(katFilter = null) {
    const iDag = new Date(); iDag.setHours(0,0,0,0);
    const dagIUke = iDag.getDay() === 0 ? 6 : iDag.getDay() - 1;

    // Forrige periode
    let forrigeStart, forrigeSlutt, denneStart, denneSlutt, nesteStart, nesteSlutt;
    const setUke = () => {
      denneStart = new Date(iDag); denneStart.setDate(iDag.getDate() - dagIUke);
      denneSlutt = new Date(denneStart); denneSlutt.setDate(denneStart.getDate() + 6);
      forrigeStart = new Date(denneStart); forrigeStart.setDate(denneStart.getDate() - 7);
      forrigeSlutt = new Date(forrigeStart); forrigeSlutt.setDate(forrigeStart.getDate() + 6);
      nesteStart = new Date(denneStart); nesteStart.setDate(denneStart.getDate() + 7);
      nesteSlutt = new Date(nesteStart); nesteSlutt.setDate(nesteStart.getDate() + 13);
    };

    if (rapportPeriode === 'uke') {
      setUke();
    } else if (rapportPeriode === '2uker') {
      denneStart = new Date(iDag); denneStart.setDate(iDag.getDate() - dagIUke);
      denneSlutt = new Date(denneStart); denneSlutt.setDate(denneStart.getDate() + 13);
      forrigeStart = new Date(denneStart); forrigeStart.setDate(denneStart.getDate() - 14);
      forrigeSlutt = new Date(denneStart); forrigeSlutt.setDate(denneStart.getDate() - 1);
      nesteStart = new Date(denneSlutt); nesteStart.setDate(denneSlutt.getDate() + 1);
      nesteSlutt = new Date(nesteStart); nesteSlutt.setDate(nesteStart.getDate() + 13);
    } else if (rapportPeriode === 'maaned') {
      denneStart = new Date(iDag.getFullYear(), iDag.getMonth(), 1);
      denneSlutt = new Date(iDag.getFullYear(), iDag.getMonth() + 1, 0);
      forrigeStart = new Date(iDag.getFullYear(), iDag.getMonth() - 1, 1);
      forrigeSlutt = new Date(iDag.getFullYear(), iDag.getMonth(), 0);
      nesteStart = new Date(iDag.getFullYear(), iDag.getMonth() + 1, 1);
      nesteSlutt = new Date(iDag.getFullYear(), iDag.getMonth() + 2, 0);
    } else if (rapportPeriode === 'egendefinert' && rapportEgendefinertStart && rapportEgendefinertSlutt) {
      denneStart = new Date(rapportEgendefinertStart + 'T00:00:00');
      denneSlutt = new Date(rapportEgendefinertSlutt + 'T00:00:00');
      const varighet = Math.round((denneSlutt - denneStart) / 86400000);
      forrigeStart = new Date(denneStart); forrigeStart.setDate(forrigeStart.getDate() - varighet);
      forrigeSlutt = new Date(denneStart); forrigeSlutt.setDate(forrigeSlutt.getDate() - 1);
      nesteStart = new Date(denneSlutt); nesteStart.setDate(nesteStart.getDate() + 1);
      nesteSlutt = new Date(nesteStart); nesteSlutt.setDate(nesteStart.getDate() + varighet - 1);
    } else { // kvartal
      denneStart = new Date(iDag.getFullYear(), iDag.getMonth(), 1);
      denneSlutt = new Date(iDag.getFullYear(), iDag.getMonth() + 3, 0);
      forrigeStart = new Date(iDag.getFullYear(), iDag.getMonth() - 3, 1);
      forrigeSlutt = new Date(iDag.getFullYear(), iDag.getMonth(), 0);
      nesteStart = new Date(iDag.getFullYear(), iDag.getMonth() + 3, 1);
      nesteSlutt = new Date(iDag.getFullYear(), iDag.getMonth() + 6, 0);
    }

    const fmt = d => d.toISOString().slice(0, 10);
    const iPeriode = (datoStr, start, slutt) => datoStr >= fmt(start) && datoStr <= fmt(slutt);

    const aktI = a => !katFilter || a.type === katFilter;
    const oppI = o => {
      if (!katFilter) return true;
      if (o.kategoriId === katFilter) return true;
      if (o.aktivitetId) {
        const a = aktiviteter.find(a => a.id === o.aktivitetId);
        if (a && a.type === katFilter) return true;
      }
      return false;
    };
    const todoI = t => {
      if (!katFilter) return true;
      if (t.kategoriId === katFilter) return true;
      if (t.aktivitetId) {
        const a = aktiviteter.find(a => a.id === t.aktivitetId);
        if (a && aktI(a)) return true;
      }
      if (t.oppgaveId) {
        const o = oppgaver.find(o => o.id === t.oppgaveId);
        if (o && oppI(o)) return true;
      }
      return false;
    };

    const fullfortForrige = [
      ...oppgaver.filter(o => oppI(o) && o.fullfort && o.fullfortDato && iPeriode(o.fullfortDato, forrigeStart, forrigeSlutt))
        .map(o => ({ type: 'oppgave', tittel: o.beskrivelse, dato: o.fullfortDato, obj: o })),
      ...todos.filter(t => todoI(t) && t.fullfort && t.fullfortDato && iPeriode(t.fullfortDato, forrigeStart, forrigeSlutt))
        .map(t => ({ type: 'to do', tittel: t.tittel, dato: t.fullfortDato, obj: t }))
    ].sort((a,b) => a.dato.localeCompare(b.dato));

    const aktDenne = aktiviteter.filter(a => aktI(a) && (
      iPeriode(a.dato, denneStart, denneSlutt) ||
      (a.datoTil && a.datoTil >= fmt(denneStart) && a.dato <= fmt(denneSlutt))
    )).sort((a,b) => a.dato.localeCompare(b.dato));

    const fristerDenne = oppgaver.filter(o => oppI(o) && !o.fullfort && o.frist && iPeriode(o.frist, denneStart, denneSlutt))
      .sort((a,b) => a.frist.localeCompare(b.frist));

    const aktNeste = aktiviteter.filter(a => aktI(a) && (
      iPeriode(a.dato, nesteStart, nesteSlutt) ||
      (a.datoTil && a.datoTil >= fmt(nesteStart) && a.dato <= fmt(nesteSlutt))
    )).sort((a,b) => a.dato.localeCompare(b.dato));

    const fristerNeste = oppgaver.filter(o => oppI(o) && !o.fullfort && o.frist && iPeriode(o.frist, nesteStart, nesteSlutt))
      .sort((a,b) => a.frist.localeCompare(b.frist));

    const todosDenne = todos.filter(t => todoI(t) && !t.fullfort && t.frist && iPeriode(t.frist, denneStart, denneSlutt))
      .sort((a,b) => a.frist.localeCompare(b.frist));

    const todosNeste = todos.filter(t => todoI(t) && !t.fullfort && t.frist && iPeriode(t.frist, nesteStart, nesteSlutt))
      .sort((a,b) => a.frist.localeCompare(b.frist));

    const forfalt = oppgaver.filter(o => oppI(o) && !o.fullfort && o.frist && o.frist < fmt(iDag))
      .sort((a,b) => a.frist.localeCompare(b.frist));

    const periodeNavn = { uke: 'Denne uken', '2uker': 'Disse 2 ukene', maaned: 'Denne måneden', kvartal: 'Dette kvartalet', egendefinert: 'Valgt periode' }[rapportPeriode] || 'Valgt periode';
    const forrigeNavn = { uke: 'Forrige uke', '2uker': 'Forrige 2 uker', maaned: 'Forrige måned', kvartal: 'Forrige kvartal', egendefinert: 'Forrige periode' }[rapportPeriode] || 'Forrige periode';
    const nesteNavn   = { uke: 'Neste 2 uker', '2uker': 'Neste 2 uker', maaned: 'Neste måned', kvartal: 'Neste kvartal', egendefinert: 'Neste periode' }[rapportPeriode] || 'Neste periode';

    return {
      iDag, forrigeStart, forrigeSlutt, denneStart, denneSlutt, nesteStart, nesteSlutt,
      fullfortForrige, aktDenne, fristerDenne, todosDenne, aktNeste, fristerNeste, todosNeste, forfalt,
      katFilter, kat: katFilter ? getKat(katFilter) : null,
      periodeNavn, forrigeNavn, nesteNavn
    };
  }

  function fmtDato(d) {
    return d.getDate() + '. ' + MAANEDER[d.getMonth()];
  }
  function fmtDatoFra(str) {
    const d = new Date(str + 'T00:00:00');
    return fmtDato(d);
  }

  function åpneRapport(katFilter = null, skipModal = false) {
    window._aktivRapportKatFilter = katFilter || null;
    const data = beregnRapportData(katFilter);
    const body = document.getElementById('rapportBody');

    const fmtPer = (a, b) => `${fmtDato(a)} – ${fmtDato(b)}`;
    const tittel = data.kat
      ? `Statusrapport — <span style="color:${data.kat.farge}">${data.kat.label}</span>`
      : 'Statusrapport';

    document.querySelector('#rapportModal .modal-tittel').textContent =
      data.kat ? `Rapport: ${data.kat.label}` : 'Rapport';

    let html = `<div class="rapport-tittel-stor">${tittel}</div>
      <div class="rapport-undertittel">${data.periodeNavn}: ${fmtPer(data.denneStart, data.denneSlutt)} · Generert ${fmtDato(data.iDag)} ${data.iDag.getFullYear()}</div>
      <div class="rapport-stat-rad">
        <div class="rapport-stat"><div class="rapport-stat-tall">${data.fullfortForrige.length}</div><div class="rapport-stat-label">Fullført ${data.forrigeNavn.toLowerCase()}</div></div>
        <div class="rapport-stat"><div class="rapport-stat-tall">${data.fristerDenne.length}</div><div class="rapport-stat-label">Frister nå</div></div>
        <div class="rapport-stat"><div class="rapport-stat-tall">${data.fristerNeste.length}</div><div class="rapport-stat-label">Frister neste</div></div>
        <div class="rapport-stat" style="${data.forfalt.length > 0 ? 'background:#fdeaea;' : ''}"><div class="rapport-stat-tall" style="${data.forfalt.length > 0 ? 'color:#c0392b;' : ''}">${data.forfalt.length}</div><div class="rapport-stat-label">Forfalt</div></div>
      </div>`;

    if (data.forfalt.length > 0) {
      html += `<div class="rapport-seksjon"><div class="rapport-seksjon-tittel" style="color:#c0392b;border-bottom-color:#c0392b;">Forfalte oppgaver</div>`;
      data.forfalt.forEach(o => {
        const kat = getKat(o.kategoriId) || getKat(aktiviteter.find(a => a.id === o.aktivitetId)?.type);
        const diff = Math.round((data.iDag - new Date(o.frist + 'T00:00:00')) / 86400000);
        html += `<div class="rapport-item">
          ${kat ? `<span class="rapport-pill" style="border-color:${kat.farge};color:${kat.farge};">${kat.label}</span>` : ''}
          <div style="flex:1;">
            <div class="rapport-item-tittel">${o.beskrivelse}</div>
            <div class="rapport-item-meta" style="color:#c0392b;font-weight:600;">${diff} dag${diff===1?'':'er'} over fristen (${fmtDatoFra(o.frist)})</div>
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    // Hierarkisk periode-rendering: leveranse → oppgave → todo
    const renderPeriodeHtml = (aktListe, oppListe, todoListe, tomTekst) => {
      if (aktListe.length === 0 && oppListe.length === 0 && todoListe.length === 0)
        return `<div class="rapport-tom">${tomTekst}</div>`;
      let h = '';
      const bruktOpp = new Set(), bruktTodo = new Set();

      aktListe.forEach(a => {
        const kat = getKat(a.type);
        const erMp = a.leveranseType === 'milepæl';
        h += `<div class="rapport-item">
          ${kat ? `<span class="rapport-pill" style="border-color:${kat.farge};color:${kat.farge};">${kat.label}</span>` : ''}
          <div style="flex:1;">
            <div class="rapport-item-tittel">${erMp ? '◆ ' : ''}${a.tittel}</div>
            <div class="rapport-item-meta">${fmtDatoFra(a.dato)}${a.datoTil && a.datoTil !== a.dato ? ' – ' + fmtDatoFra(a.datoTil) : ''}${a.tid ? ' · kl. ' + a.tid : ''}</div>
          </div>
        </div>`;
        oppListe.filter(o => o.aktivitetId === a.id).forEach(o => {
          bruktOpp.add(o.id);
          h += `<div class="rapport-item" style="margin-left:14px;border-left:2px solid var(--kant);padding-left:10px;margin-top:2px;">
            <div style="flex:1;">
              <div class="rapport-item-tittel" style="font-size:13px;">↳ ${o.beskrivelse}</div>
              <div class="rapport-item-meta">Oppgave · Frist ${fmtDatoFra(o.frist)}</div>
            </div>
          </div>`;
          todoListe.filter(t => t.oppgaveId === o.id).forEach(t => {
            bruktTodo.add(t.id);
            h += `<div class="rapport-item" style="margin-left:28px;border-left:2px solid var(--kant);padding-left:10px;margin-top:2px;">
              <div style="flex:1;">
                <div class="rapport-item-tittel" style="font-size:12px;">◻ ${t.tittel}</div>
                <div class="rapport-item-meta">To do · Frist ${fmtDatoFra(t.frist)}</div>
              </div>
            </div>`;
          });
        });
        // Todos koblet direkte til leveransen (uten via oppgave)
        todoListe.filter(t => t.aktivitetId === a.id && !bruktTodo.has(t.id)).forEach(t => {
          bruktTodo.add(t.id);
          h += `<div class="rapport-item" style="margin-left:14px;border-left:2px solid var(--kant);padding-left:10px;margin-top:2px;">
            <div style="flex:1;">
              <div class="rapport-item-tittel" style="font-size:12px;">◻ ${t.tittel}</div>
              <div class="rapport-item-meta">To do · Frist ${fmtDatoFra(t.frist)}</div>
            </div>
          </div>`;
        });
      });

      oppListe.filter(o => !bruktOpp.has(o.id)).forEach(o => {
        const kat = getKat(o.kategoriId) || getKat(aktiviteter.find(a => a.id === o.aktivitetId)?.type);
        h += `<div class="rapport-item">
          ${kat ? `<span class="rapport-pill" style="border-color:${kat.farge};color:${kat.farge};">${kat.label}</span>` : ''}
          <div style="flex:1;">
            <div class="rapport-item-tittel">${o.beskrivelse}</div>
            <div class="rapport-item-meta">Oppgave · Frist ${fmtDatoFra(o.frist)}</div>
          </div>
        </div>`;
        todoListe.filter(t => t.oppgaveId === o.id).forEach(t => {
          bruktTodo.add(t.id);
          h += `<div class="rapport-item" style="margin-left:14px;border-left:2px solid var(--kant);padding-left:10px;margin-top:2px;">
            <div style="flex:1;">
              <div class="rapport-item-tittel" style="font-size:12px;">◻ ${t.tittel}</div>
              <div class="rapport-item-meta">To do · Frist ${fmtDatoFra(t.frist)}</div>
            </div>
          </div>`;
        });
      });

      todoListe.filter(t => !bruktTodo.has(t.id)).forEach(t => {
        const kat = getKat(t.kategoriId) || (t.oppgaveId ? getKat(oppgaver.find(o => o.id === t.oppgaveId)?.kategoriId) : null);
        h += `<div class="rapport-item">
          ${kat ? `<span class="rapport-pill" style="border-color:${kat.farge};color:${kat.farge};">${kat.label}</span>` : '<span class="rapport-pill" style="border-color:var(--kant);color:var(--tekst-sek);">To do</span>'}
          <div style="flex:1;">
            <div class="rapport-item-tittel">◻ ${t.tittel}</div>
            <div class="rapport-item-meta">To do · Frist ${fmtDatoFra(t.frist)}</div>
          </div>
        </div>`;
      });

      return h;
    };

    html += `<div class="rapport-seksjon"><div class="rapport-seksjon-tittel">${data.periodeNavn} (${fmtPer(data.denneStart, data.denneSlutt)})</div>`;
    html += renderPeriodeHtml(data.aktDenne, data.fristerDenne, data.todosDenne, 'Ingenting planlagt i denne perioden.');
    html += `</div>`;

    html += `<div class="rapport-seksjon"><div class="rapport-seksjon-tittel">${data.nesteNavn} (${fmtPer(data.nesteStart, data.nesteSlutt)})</div>`;
    html += renderPeriodeHtml(data.aktNeste, data.fristerNeste, data.todosNeste, 'Ingenting planlagt i neste periode.');
    html += `</div>`;

    html += `<div class="rapport-seksjon"><div class="rapport-seksjon-tittel">Fullført ${data.forrigeNavn.toLowerCase()} (${fmtPer(data.forrigeStart, data.forrigeSlutt)})</div>`;
    if (data.fullfortForrige.length === 0) {
      html += `<div class="rapport-tom">Ingen registrerte fullføringer i forrige periode.</div>`;
    } else {
      data.fullfortForrige.forEach(item => {
        const kat = item.obj.kategoriId ? getKat(item.obj.kategoriId) :
                    (item.obj.aktivitetId ? getKat(aktiviteter.find(a => a.id === item.obj.aktivitetId)?.type) :
                    (item.obj.oppgaveId ? getKat(oppgaver.find(o => o.id === item.obj.oppgaveId)?.kategoriId) : null));
        html += `<div class="rapport-item">
          ${kat ? `<span class="rapport-pill" style="border-color:${kat.farge};color:${kat.farge};">${kat.label}</span>` : `<span class="rapport-pill" style="border-color:var(--kant);color:var(--tekst-sek);">${item.type}</span>`}
          <div style="flex:1;">
            <div class="rapport-item-tittel">${item.tittel}</div>
            <div class="rapport-item-meta">Fullført ${fmtDatoFra(item.dato)}</div>
          </div>
        </div>`;
      });
    }
    html += `</div>`;

    body.innerHTML = html;
    if (!skipModal) document.getElementById('rapportModal').classList.add('vis');
  }

  function eksporterRapportMarkdown() {
    const katFilter = window._aktivRapportKatFilter || null;
    const data = beregnRapportData(katFilter);
    const fmtPer = (a, b) => `${fmtDato(a)} – ${fmtDato(b)}`;
    const tittel = data.kat ? `Statusrapport — ${data.kat.label}` : `Statusrapport — Prosjekter`;

    let md = `# ${tittel}\n\n`;
    md += `**Denne uken:** ${fmtPer(data.denneMandag, data.denneSondag)}  \n`;
    md += `**Generert:** ${fmtDato(data.iDag)} ${data.iDag.getFullYear()}\n\n---\n\n`;
    md += `## Nøkkeltall\n\n| | |\n|---|---|\n`;
    md += `| Fullført ${data.forrigeNavn.toLowerCase()} | ${data.fullfortForrige.length} |\n`;
    md += `| Frister nå | ${data.fristerDenne.length} |\n`;
    md += `| Frister neste | ${data.fristerNeste.length} |\n`;
    md += `| Forfalt | ${data.forfalt.length} |\n\n`;

    if (data.forfalt.length > 0) {
      md += `## Forfalte oppgaver\n\n`;
      data.forfalt.forEach(o => {
        const diff = Math.round((data.iDag - new Date(o.frist + 'T00:00:00')) / 86400000);
        md += `- **${o.beskrivelse}** — ${diff} dag${diff===1?'':'er'} over fristen (${fmtDatoFra(o.frist)})\n`;
      });
      md += `\n`;
    }

    // Hierarkisk markdown-periode: leveranse → oppgave → todo
    const mdPeriode = (aktListe, oppListe, todoListe) => {
      if (aktListe.length === 0 && oppListe.length === 0 && todoListe.length === 0) { md += `_Ingenting planlagt._\n\n`; return; }
      const bruktOpp = new Set(), bruktTodo = new Set();
      aktListe.forEach(a => {
        const kat = getKat(a.type);
        const erMp = a.leveranseType === 'milepæl';
        md += `- ${kat ? `[${kat.label}] ` : ''}**${erMp ? '◆ ' : ''}${a.tittel}** — ${fmtDatoFra(a.dato)}${a.datoTil && a.datoTil !== a.dato ? ' – ' + fmtDatoFra(a.datoTil) : ''}${a.tid ? ' kl. ' + a.tid : ''}\n`;
        oppListe.filter(o => o.aktivitetId === a.id).forEach(o => {
          bruktOpp.add(o.id);
          md += `  - ↳ ${o.beskrivelse} — oppgave, frist ${fmtDatoFra(o.frist)}\n`;
          todoListe.filter(t => t.oppgaveId === o.id).forEach(t => { bruktTodo.add(t.id); md += `    - ☐ ${t.tittel} — to do, frist ${fmtDatoFra(t.frist)}\n`; });
        });
      });
      oppListe.filter(o => !bruktOpp.has(o.id)).forEach(o => {
        const kat = getKat(o.kategoriId) || getKat(aktiviteter.find(a => a.id === o.aktivitetId)?.type);
        md += `- ${kat ? `[${kat.label}] ` : ''}**${o.beskrivelse}** — oppgave, frist ${fmtDatoFra(o.frist)}\n`;
        todoListe.filter(t => t.oppgaveId === o.id).forEach(t => { bruktTodo.add(t.id); md += `  - ☐ ${t.tittel} — to do, frist ${fmtDatoFra(t.frist)}\n`; });
      });
      todoListe.filter(t => !bruktTodo.has(t.id)).forEach(t => {
        const kat = getKat(t.kategoriId) || (t.oppgaveId ? getKat(oppgaver.find(o => o.id === t.oppgaveId)?.kategoriId) : null);
        md += `- ${kat ? `[${kat.label}] ` : ''}☐ ${t.tittel} — to do, frist ${fmtDatoFra(t.frist)}\n`;
      });
      md += `\n`;
    };

    md += `## ${data.periodeNavn} (${fmtPer(data.denneStart, data.denneSlutt)})\n\n`;
    mdPeriode(data.aktDenne, data.fristerDenne, data.todosDenne);

    md += `## ${data.nesteNavn} (${fmtPer(data.nesteStart, data.nesteSlutt)})\n\n`;
    mdPeriode(data.aktNeste, data.fristerNeste, data.todosNeste);

    md += `## Fullført ${data.forrigeNavn.toLowerCase()} (${fmtPer(data.forrigeStart, data.forrigeSlutt)})\n\n`;
    if (data.fullfortForrige.length === 0) md += `_Ingen registrerte fullføringer._\n\n`;
    else { data.fullfortForrige.forEach(item => { md += `- **${item.tittel}** _(${item.type}, ${fmtDatoFra(item.dato)})_\n`; }); md += `\n`; }

    md += `---\n\n_Generert av Prosjekter._\n`;

    const blob = new Blob([md], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const navnDel = data.kat ? '-' + data.kat.label.toLowerCase().replace(/[^a-z0-9]+/g, '-') : '';
    a.download = `statusrapport${navnDel}-${data.iDag.toISOString().slice(0,10)}.md`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ── Hjelpefunksjon: hent data fra et annet prosjekt ──
  function _hentProsjektData(prosjektId) {
    const pk = s => 'lp_' + prosjektId + '_' + s;
    return {
      aktiviteter: JSON.parse(localStorage.getItem(pk('a')) || '[]'),
      oppgaver:    JSON.parse(localStorage.getItem(pk('o')) || '[]'),
      todos:       JSON.parse(localStorage.getItem(pk('t')) || '[]'),
      kategorier:  JSON.parse(localStorage.getItem(pk('k')) || '[]'),
      tidslinjeGrenser: JSON.parse(localStorage.getItem(pk('tl')) || '{}')
    };
  }

  function åpneRapportVelger() {
    const body = document.getElementById('rapportVelgerBody');
    body.innerHTML = '';
    body.style.cssText = 'padding:18px 22px;display:flex;flex-direction:column;gap:8px;';

    const lagValg = (label, sub, farge, onClick) => {
      const btn = document.createElement('button');
      btn.style.cssText = 'display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--kant);border-radius:var(--rs);background:var(--hvit);cursor:pointer;text-align:left;transition:all .15s;font-family:\'Nunito\',sans-serif;';
      btn.onmouseover = () => { btn.style.borderColor = farge; btn.style.background = farge + '12'; };
      btn.onmouseout  = () => { btn.style.borderColor = 'var(--kant)'; btn.style.background = 'var(--hvit)'; };
      btn.onclick = () => onClick();

      const dot = document.createElement('div');
      dot.style.cssText = `width:14px;height:14px;border-radius:50%;background:${farge};flex-shrink:0;`;
      btn.appendChild(dot);

      const txt = document.createElement('div');
      txt.style.flex = '1';
      txt.innerHTML = `<div style="font-weight:700;font-size:14px;color:var(--tekst);">${label}</div>
        ${sub ? `<div style="font-size:11px;color:var(--tekst-sek);margin-top:2px;">${sub}</div>` : ''}`;
      btn.appendChild(txt);

      const pil = document.createElement('div');
      pil.style.cssText = 'color:var(--tekst-sek);font-size:16px;';
      pil.textContent = '›';
      btn.appendChild(pil);

      body.appendChild(btn);
    };

    const lagSkille = (tekst) => {
      const skille = document.createElement('div');
      skille.style.cssText = 'font-size:10px;font-weight:700;font-family:"Syne",sans-serif;color:var(--tekst-sek);text-transform:uppercase;letter-spacing:0.5px;margin-top:6px;margin-bottom:-2px;padding:0 2px;';
      skille.textContent = tekst;
      body.appendChild(skille);
    };

    // ── Steg 1: prosjektvalg ──
    const visProsjektValg = () => {
      body.innerHTML = '';
      document.querySelector('#rapportVelgerModal .modal-tittel').textContent = 'Velg prosjekt(er)';

      const valgte = new Set([aktivtProsjektId]);

      const lagCheckbox = (p) => {
        const row = document.createElement('label');
        row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid var(--kant);border-radius:var(--rs);background:var(--hvit);cursor:pointer;transition:all .15s;font-family:"Nunito",sans-serif;';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = valgte.has(p.id);
        cb.style.cssText = 'width:18px;height:18px;accent-color:' + p.farge + ';flex-shrink:0;cursor:pointer;';
        cb.onchange = () => {
          if (cb.checked) valgte.add(p.id); else valgte.delete(p.id);
          row.style.borderColor = cb.checked ? p.farge : 'var(--kant)';
          row.style.background = cb.checked ? p.farge + '12' : 'var(--hvit)';
          genBtn.disabled = valgte.size === 0;
          genBtn.style.opacity = valgte.size === 0 ? '0.5' : '1';
        };
        const dot = document.createElement('div');
        dot.style.cssText = `width:12px;height:12px;border-radius:50%;background:${p.farge};flex-shrink:0;`;
        const txt = document.createElement('div');
        txt.style.cssText = 'flex:1;font-weight:700;font-size:14px;color:var(--tekst);';
        txt.textContent = p.navn;
        row.appendChild(cb);
        row.appendChild(dot);
        row.appendChild(txt);
        if (cb.checked) { row.style.borderColor = p.farge; row.style.background = p.farge + '12'; }
        body.appendChild(row);
      };

      prosjekter.forEach(p => lagCheckbox(p));

      const genBtn = document.createElement('button');
      genBtn.style.cssText = 'width:100%;padding:13px;margin-top:6px;background:var(--grønn);color:white;border:none;border-radius:var(--rs);font-family:"Syne",sans-serif;font-weight:700;font-size:14px;cursor:pointer;';
      genBtn.textContent = 'Generer rapport';
      genBtn.onclick = () => {
        const ider = [...valgte];
        if (ider.length === 0) return;
        if (ider.length === 1) {
          visKategoriValg(ider[0]);
        } else {
          lukkModal('rapportVelgerModal');
          åpneRapportMulti(ider);
        }
      };
      body.appendChild(genBtn);
    };

    // ── Steg 2: kategori-valg innen valgt prosjekt ──
    // ── Steg 2: kategori-valg ──
    const visKategoriValg = (prosjektId) => {
      body.innerHTML = '';
      const p = prosjekter.find(p => p.id === prosjektId);
      document.querySelector('#rapportVelgerModal .modal-tittel').textContent = p ? p.navn : 'Velg kategori';

      // Tilbake-knapp
      if (prosjekter.length > 1) {
        const tilbake = document.createElement('button');
        tilbake.style.cssText = 'display:flex;align-items:center;gap:6px;padding:6px 2px;border:none;background:none;cursor:pointer;font-family:"Nunito",sans-serif;font-size:12px;color:var(--tekst-sek);margin-bottom:-4px;';
        tilbake.innerHTML = '‹ Tilbake til prosjekter';
        tilbake.onclick = visProsjektValg;
        body.appendChild(tilbake);
      }

      // Hent data for valgt prosjekt
      const erAktivt = prosjektId === aktivtProsjektId;
      const pData = erAktivt ? { aktiviteter, oppgaver, todos, kategorier } : _hentProsjektData(prosjektId);

      lagValg('Hele prosjektet', 'Alle kategorier', p ? p.farge : 'var(--grønn)', () => {
        lukkModal('rapportVelgerModal');
        if (erAktivt) { _rapportKontekst = null; åpneRapport(); }
        else { åpneRapportForProsjekt(prosjektId); }
      });

      if (pData.kategorier.length > 0) {
        lagSkille('Eller velg kategori');
        pData.kategorier.forEach(k => {
          const stats = pData.oppgaver.filter(o => {
            const akt = o.aktivitetId ? pData.aktiviteter.find(a => a.id === o.aktivitetId) : null;
            return (akt?.type || o.kategoriId) === k.id;
          }).length;
          lagValg(k.label, `${stats} oppgave${stats === 1 ? '' : 'r'}`, k.farge, () => {
            lukkModal('rapportVelgerModal');
            if (erAktivt) { _rapportKontekst = null; åpneRapport(k.id); }
            else { åpneRapportForProsjekt(prosjektId, k.id); }
          });
        });
      }
    };

    // Hvis bare ett prosjekt, gå rett til kategori-valg
    if (prosjekter.length <= 1) {
      visKategoriValg(aktivtProsjektId);
    } else {
      visProsjektValg();
    }

    document.getElementById('rapportVelgerModal').classList.add('vis');
  }

  // ── Rapport for et annet prosjekt ──
  function åpneRapportForProsjekt(prosjektId, katFilter = null) {
    const pData = _hentProsjektData(prosjektId);
    const p = prosjekter.find(p => p.id === prosjektId);
    const katNavn = katFilter ? (pData.kategorier.find(k => k.id === katFilter)?.label || '') : '';
    const tittel = katNavn ? `${p.navn}: ${katNavn}` : `Rapport: ${p.navn}`;
    const undertittel = katNavn
      ? `Statusrapport — <span style="color:${pData.kategorier.find(k=>k.id===katFilter)?.farge||''}">${katNavn}</span>`
      : 'Statusrapport — ' + (p?.navn || '');

    // Lagre kontekst for periodebytte
    _rapportKontekst = {
      aktiviteter: pData.aktiviteter,
      oppgaver: pData.oppgaver,
      todos: pData.todos,
      kategorier: pData.kategorier,
      katFilter, tittel, undertittel
    };

    // Midlertidig bytt globale variabler for rendering
    const bak = { aktiviteter, oppgaver, todos, kategorier };
    aktiviteter = pData.aktiviteter;
    oppgaver = pData.oppgaver;
    todos = pData.todos;
    kategorier = pData.kategorier;
    genererKategoriCSS();
    åpneRapport(katFilter);
    document.querySelector('#rapportModal .modal-tittel').textContent = tittel;
    const el = document.querySelector('.rapport-tittel-stor');
    if (el) el.innerHTML = undertittel;
    // Gjenopprett
    aktiviteter = bak.aktiviteter;
    oppgaver = bak.oppgaver;
    todos = bak.todos;
    kategorier = bak.kategorier;
    genererKategoriCSS();
  }

  // ── Tverrprosjekt-rapport ──
  function _samlProsjektData(prosjektIder) {
    const samlet = { aktiviteter: [], oppgaver: [], todos: [], kategorier: [] };
    prosjektIder.forEach(pid => {
      const erAktivt = pid === aktivtProsjektId;
      const d = erAktivt
        ? { aktiviteter: JSON.parse(JSON.stringify(aktiviteter)), oppgaver: JSON.parse(JSON.stringify(oppgaver)), todos: JSON.parse(JSON.stringify(todos)), kategorier: JSON.parse(JSON.stringify(kategorier)) }
        : _hentProsjektData(pid);
      const p = prosjekter.find(p => p.id === pid);
      const prefix = prosjektIder.length > 1 && p ? p.navn + ': ' : '';
      d.aktiviteter.forEach(a => samlet.aktiviteter.push({ ...a, tittel: prefix + a.tittel }));
      d.oppgaver.forEach(o => samlet.oppgaver.push({ ...o, beskrivelse: prefix + o.beskrivelse }));
      d.todos.forEach(t => samlet.todos.push({ ...t, tittel: prefix + t.tittel }));
      d.kategorier.forEach(k => { if (!samlet.kategorier.find(sk => sk.id === k.id)) samlet.kategorier.push(k); });
    });
    return samlet;
  }

  function åpneRapportMulti(prosjektIder) {
    const samlet = _samlProsjektData(prosjektIder);
    const valgteNavn = prosjektIder.map(id => prosjekter.find(p => p.id === id)?.navn).filter(Boolean);
    const rapportNavn = prosjektIder.length === prosjekter.length ? 'Alle prosjekter' : valgteNavn.join(', ');
    const tittel = 'Rapport: ' + rapportNavn;
    const undertittel = 'Statusrapport — ' + rapportNavn;

    // Lagre kontekst for periodebytte
    _rapportKontekst = {
      aktiviteter: samlet.aktiviteter,
      oppgaver: samlet.oppgaver,
      todos: samlet.todos,
      kategorier: samlet.kategorier,
      katFilter: null, tittel, undertittel
    };

    const bak = { aktiviteter, oppgaver, todos, kategorier };
    aktiviteter = samlet.aktiviteter;
    oppgaver = samlet.oppgaver;
    todos = samlet.todos;
    kategorier = samlet.kategorier;
    genererKategoriCSS();
    åpneRapport();
    document.querySelector('#rapportModal .modal-tittel').textContent = tittel;
    const tittelEl = document.querySelector('.rapport-tittel-stor');
    if (tittelEl) tittelEl.innerHTML = undertittel;
    aktiviteter = bak.aktiviteter;
    oppgaver = bak.oppgaver;
    todos = bak.todos;
    kategorier = bak.kategorier;
    genererKategoriCSS();
  }

  function ryddFullforte() {
    const iDag = new Date();
    const grense = new Date(iDag); grense.setDate(iDag.getDate() - 3);
    const g3 = grense.toISOString().slice(0,10);
    const forOpp = oppgaver.length;
    const forTod = todos.length;
    oppgaver = oppgaver.filter(o => !(o.fullfort && (!o.fullfortDato || o.fullfortDato < g3)));
    todos    = todos.filter(t => !(t.fullfort && (!t.fullfortDato || t.fullfortDato < g3)));
    if (oppgaver.length !== forOpp || todos.length !== forTod) lagre();
  }

  function renderHovedFilter() {
    const knapper = document.getElementById('hovedFilterKnapper');
    if (!knapper) return;
    knapper.innerHTML = '';

    // Alle-knapp
    const alleBtn = document.createElement('button');
    alleBtn.className = 'filter-pill' + (!globalKatFilter ? ' aktiv' : '');
    alleBtn.textContent = 'Alle';
    alleBtn.onclick = () => settGlobalFilter(null);
    knapper.appendChild(alleBtn);

    kategorier.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'filter-pill' + (globalKatFilter === k.id ? ' aktiv-' + k.id : ' farge-' + k.id);
      btn.textContent = k.label;
      btn.onclick = () => settGlobalFilter(k.id);
      knapper.appendChild(btn);
    });
  }

  function settGlobalFilter(katId) {
    globalKatFilter = katId;
    renderHovedFilter();
    oppdaterAktivPanel();
    // Vis aktiv filter-indikator i header
    const kat = katId ? getKat(katId) : null;
    const badge = document.getElementById('filterBadge');
    if (badge) {
      if (kat) {
        badge.textContent = kat.label;
        badge.style.display = 'inline-block';
        badge.style.background = kat.farge;
      } else {
        badge.style.display = 'none';
      }
    }
  }

  function matcherGlobalFilter(type, kategoriId, aktivitetId) {
    if (!globalKatFilter) return true;
    if (type === globalKatFilter) return true;
    if (kategoriId === globalKatFilter) return true;
    if (aktivitetId) {
      const akt = aktiviteter.find(a => a.id === aktivitetId);
      if (akt && akt.type === globalKatFilter) return true;
    }
    return false;
  }

  // ── Prosjekt-meny (dropdown i header) ──
  function toggleProsjektMeny() {
    const meny = document.getElementById('prosjektMeny');
    if (meny.style.display !== 'none') { meny.style.display = 'none'; return; }
    meny.innerHTML = '';
    prosjekter.forEach(p => {
      const el = document.createElement('div');
      el.style.cssText = `padding:10px 14px;font-size:13px;font-weight:${p.id===aktivtProsjektId?'700':'500'};font-family:'Nunito',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--tekst);transition:background .1s;`;
      el.onmouseenter = () => el.style.background = 'var(--bg)';
      el.onmouseleave = () => el.style.background = '';
      const dot = document.createElement('span');
      dot.style.cssText = `width:10px;height:10px;border-radius:50%;background:${p.farge};flex-shrink:0;`;
      el.appendChild(dot);
      el.appendChild(document.createTextNode(p.navn));
      if (p.id === aktivtProsjektId) {
        const check = document.createElement('span');
        check.style.cssText = 'margin-left:auto;font-size:14px;color:var(--grønn);';
        check.textContent = '✓';
        el.appendChild(check);
      }
      el.onclick = e => { e.stopPropagation(); meny.style.display = 'none'; if (p.id !== aktivtProsjektId) byttProsjekt(p.id); };
      meny.appendChild(el);
    });
    meny.style.display = 'block';
    // Lukk menyen ved klikk utenfor
    const lukkHandler = e => { if (!meny.contains(e.target) && !e.target.closest('.logo')) { meny.style.display = 'none'; document.removeEventListener('click', lukkHandler); }};
    setTimeout(() => document.addEventListener('click', lukkHandler), 0);
  }

  function visNyttProsjektDialog() {
    const navn = prompt('Navn på nytt prosjekt:');
    if (!navn || !navn.trim()) return;
    opprettProsjekt(navn.trim());
  }

  function oppdaterProsjektNavn(navn) {
    const p = hentAktivtProsjekt();
    if (p) { p.navn = navn; lagreProsjekter(); oppdaterProsjektTittel(); }
  }

  function oppdaterProsjektFarge(farge) {
    const p = hentAktivtProsjekt();
    if (p) { p.farge = farge; lagreProsjekter(); settProsjektFarger(farge); }
  }

  function init() {
    // Sett prosjektfarge og tittel
    const p = hentAktivtProsjekt();
    settProsjektFarger(p.farge);
    oppdaterProsjektTittel();
    hent();
    ryddFullforte();
    renderHovedFilter();
    renderTodos();
    renderTidslinje();
    oppdaterForfaltBadge();
  }

  function be0mVarsel() {
    document.getElementById('varselBanner').style.display = 'none';
    Notification.requestPermission().then(result => {
      if (result === 'granted') {
        oppdaterForfaltBadge();
      }
    });
  }

  function avvisVarsel() {
    document.getElementById('varselBanner').style.display = 'none';
    localStorage.setItem('varsel_avvist', '1');
  }

  init();
</script>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFirestore, doc, setDoc, getDoc, getDocFromServer, onSnapshot }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyC_6N483KSKRNQaQZ-Jsxh01fWR5cT5iLA",
    authDomain: "mishmash-wp4.firebaseapp.com",
    projectId: "mishmash-wp4",
    storageBucket: "mishmash-wp4.firebasestorage.app",
    messagingSenderId: "220759938476",
    appId: "1:220759938476:web:da647c94b80553deea9609"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // ── Eksponér til resten av appen ──
  window._fbSignIn = async () => {
    try {
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' }); // vis alltid kontovalg
      await signInWithPopup(auth, provider);
    } catch(e) {
      alert('Innlogging feilet: ' + e.message);
    }
  };

  window._fbSignOut = async () => {
    await signOut(auth);
  };

  // ── Synk-status-indikator ──
  function visSynkStatus(tekst, farge, ms) {
    let el = document.getElementById('synkStatus');
    if (!el) {
      el = document.createElement('div');
      el.id = 'synkStatus';
      el.style.cssText = 'position:fixed;bottom:8px;right:8px;padding:6px 12px;border-radius:12px;font-size:11px;font-weight:700;font-family:"Syne",sans-serif;z-index:9999;pointer-events:none;transition:opacity 0.5s;max-width:80vw;word-break:break-word;';
      document.body.appendChild(el);
    }
    el.textContent = tekst;
    el.style.background = farge;
    el.style.color = '#fff';
    el.style.opacity = '1';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.style.opacity = '0'; }, ms || 3000);
  }

  // ── Synkroniser data med Firestore ──
  function _skyDocRef(userId) {
    const pid = window._getAktivtProsjektId() || 'default';
    return doc(db, 'brukere', userId, 'prosjekter', pid);
  }

  async function lagreTilSky(userId) {
    const pid = window._getAktivtProsjektId();
    if (!pid) return;
    const pk = s => 'lp_' + pid + '_' + s;
    try {
      visSynkStatus('Synkroniserer…', '#f39c12');

      // Hent eksisterende prosjektliste fra sky for å merge
      const lokaleProsjekter = JSON.parse(localStorage.getItem('lp_prosjekter') || '[]');
      let mergedProsjekter = [...lokaleProsjekter];
      try {
        const brukerSnap = await getDoc(doc(db, 'brukere', userId));
        if (brukerSnap.exists() && brukerSnap.data().prosjekter) {
          const skyProsjekter = brukerSnap.data().prosjekter;
          // Legg til sky-prosjekter som ikke finnes lokalt
          skyProsjekter.forEach(sp => {
            if (!mergedProsjekter.find(lp => lp.id === sp.id)) mergedProsjekter.push(sp);
          });
          // Oppdater eksisterende med lokale verdier (navn, farge)
          mergedProsjekter = mergedProsjekter.map(mp => {
            const lokal = lokaleProsjekter.find(lp => lp.id === mp.id);
            return lokal || mp;
          });
        }
      } catch(e) { /* ignorer merge-feil, bruk lokale */ }

      // Lagre prosjektliste på brukernivå
      await setDoc(doc(db, 'brukere', userId), {
        prosjekter: mergedProsjekter,
        aktivtProsjekt: pid,
        oppdatert: new Date().toISOString()
      });

      // Lagre prosjektdata i subcollection
      await setDoc(doc(db, 'brukere', userId, 'prosjekter', pid), {
        aktiviteter: JSON.parse(localStorage.getItem(pk('a')) || '[]'),
        oppgaver:    JSON.parse(localStorage.getItem(pk('o')) || '[]'),
        todos:       JSON.parse(localStorage.getItem(pk('t')) || '[]'),
        kategorier:  JSON.parse(localStorage.getItem(pk('k')) || 'null') || [],
        filterAkt:   JSON.parse(localStorage.getItem(pk('fa')) || '{}'),
        filterOpp:   JSON.parse(localStorage.getItem(pk('fo')) || '{}'),
        tidslinjeGrenser: JSON.parse(localStorage.getItem(pk('tl')) || '{}'),
        oppdatert:   new Date().toISOString()
      });
      visSynkStatus('✓ Synkronisert', '#27ae60');
    } catch(e) {
      visSynkStatus('✗ ' + (e.code || e.message || 'Synk feilet'), '#e74c3c', 15000);
      console.error('[SYNK] Sky-lagring feilet:', e.code, e.message, e);
    }
  }

  window._lagreTilSky = lagreTilSky;

  // ── Hjelpefunksjon: oppdater app etter sky-data ──
  function _oppdaterAppFraSky() {
    if (typeof hent === 'function') hent();
    if (typeof ryddFullforte === 'function') ryddFullforte();
    if (typeof renderHovedFilter === 'function') renderHovedFilter();
    if (typeof oppdaterAktivPanel === 'function') oppdaterAktivPanel();
    if (typeof renderTodos === 'function') renderTodos();
    if (typeof renderTidslinje === 'function' && typeof kalVisning !== 'undefined' && kalVisning === 'tidslinje') renderTidslinje();
    if (typeof oppdaterForfaltBadge === 'function') oppdaterForfaltBadge();
  }

  // ── Last prosjektdata fra sky ──
  async function _lastProsjektFraSky(userId, prosjektId) {
    const pk = s => 'lp_' + prosjektId + '_' + s;
    let snap;
    try {
      snap = await getDocFromServer(doc(db, 'brukere', userId, 'prosjekter', prosjektId));
      console.log('[SYNK] ✓ Prosjekt hentet fra server:', prosjektId, 'exists:', snap.exists());
    } catch(e) {
      console.warn('[SYNK] Server-henting feilet for prosjekt', prosjektId, ':', e.code);
      try { snap = await getDoc(doc(db, 'brukere', userId, 'prosjekter', prosjektId)); } catch(e2) { return; }
    }
    if (snap && snap.exists()) {
      const data = snap.data();
      localStorage.setItem(pk('a'), JSON.stringify(data.aktiviteter || []));
      localStorage.setItem(pk('o'), JSON.stringify(data.oppgaver    || []));
      localStorage.setItem(pk('t'), JSON.stringify(data.todos       || []));
      localStorage.setItem(pk('k'), JSON.stringify(data.kategorier  || []));
      if (data.filterAkt) localStorage.setItem(pk('fa'), JSON.stringify(data.filterAkt));
      if (data.filterOpp) localStorage.setItem(pk('fo'), JSON.stringify(data.filterOpp));
      if (data.tidslinjeGrenser) localStorage.setItem(pk('tl'), JSON.stringify(data.tidslinjeGrenser));
    }
  }

  // ── Start lytter for aktivt prosjekt ──
  function _startProsjektLytter(userId, prosjektId) {
    if (window._unsub) window._unsub();
    const pk = s => 'lp_' + prosjektId + '_' + s;
    let firstSnapshot = true;
    window._unsub = onSnapshot(doc(db, 'brukere', userId, 'prosjekter', prosjektId), snap => {
      if (firstSnapshot) { firstSnapshot = false; return; }
      if (!snap.exists()) return;
      const data = snap.data();
      console.log('[SYNK] onSnapshot: endring mottatt for prosjekt', prosjektId);
      const nyA = JSON.stringify(data.aktiviteter || []);
      const nyO = JSON.stringify(data.oppgaver    || []);
      const nyT = JSON.stringify(data.todos       || []);
      const nyK = JSON.stringify(data.kategorier  || []);
      const nyFA = JSON.stringify(data.filterAkt  || {});
      const nyFO = JSON.stringify(data.filterOpp  || {});
      if (nyA !== localStorage.getItem(pk('a')) || nyO !== localStorage.getItem(pk('o')) ||
          nyT !== localStorage.getItem(pk('t')) || nyK !== localStorage.getItem(pk('k')) ||
          nyFA !== localStorage.getItem(pk('fa')) || nyFO !== localStorage.getItem(pk('fo'))) {
        visSynkStatus('↓ Mottatt fra sky', '#3498db');
        localStorage.setItem(pk('a'), nyA);
        localStorage.setItem(pk('o'), nyO);
        localStorage.setItem(pk('t'), nyT);
        localStorage.setItem(pk('k'), nyK);
        if (data.filterAkt) localStorage.setItem(pk('fa'), nyFA);
        if (data.filterOpp) localStorage.setItem(pk('fo'), nyFO);
        if (data.tidslinjeGrenser) localStorage.setItem(pk('tl'), JSON.stringify(data.tidslinjeGrenser));
        _oppdaterAppFraSky();
      }
    });
  }

  // ── Bytt sky-prosjekt (kalles fra byttProsjekt()) ──
  window._byttSkyProsjekt = async function() {
    const uid = window._currentUid;
    const pid = window._getAktivtProsjektId();
    if (!uid || !pid) return;
    await _lastProsjektFraSky(uid, pid);
    _oppdaterAppFraSky();
    _startProsjektLytter(uid, pid);
  };

  // ── Auth-tilstand ──
  onAuthStateChanged(auth, async bruker => {
    const loginOverlay = document.getElementById('loginOverlay');

    if (bruker) {
      // Logget inn
      loginOverlay.style.display = 'none';
      const navn = bruker.displayName || bruker.email;
      const innstBruker = document.getElementById('innstillingerBruker');
      const innstNavn   = document.getElementById('innstillingerBrukerNavn');
      if (innstBruker) innstBruker.style.display = 'flex';
      if (innstNavn)   innstNavn.textContent = navn;
      window._currentUid = bruker.uid;

      // Hent prosjektliste fra sky
      console.log('[SYNK] Henter prosjektliste for uid:', bruker.uid);
      let brukerSnap;
      try {
        brukerSnap = await getDocFromServer(doc(db, 'brukere', bruker.uid));
      } catch(e) {
        console.warn('[SYNK] Server-henting feilet, prøver cache:', e.code);
        try { brukerSnap = await getDoc(doc(db, 'brukere', bruker.uid)); } catch(e2) { /* ignore */ }
      }

      // Sjekk om vi trenger migrering fra gammel flat struktur
      if (brukerSnap && brukerSnap.exists()) {
        const brukerData = brukerSnap.data();
        if (brukerData.aktiviteter && !brukerData.prosjekter) {
          // Gammel flat struktur i sky – migrer til subcollection
          // Bruk lokalt prosjekt-ID som kilde til sannhet
          console.log('[SYNK] Migrerer fra flat struktur til prosjekt-subcollection');
          const pid = window._getAktivtProsjektId();
          if (pid) {
            try {
              await setDoc(doc(db, 'brukere', bruker.uid, 'prosjekter', pid), {
                aktiviteter: brukerData.aktiviteter || [],
                oppgaver:    brukerData.oppgaver || [],
                todos:       brukerData.todos || [],
                kategorier:  brukerData.kategorier || [],
                filterAkt:   brukerData.filterAkt || {},
                filterOpp:   brukerData.filterOpp || {},
                oppdatert:   brukerData.oppdatert || new Date().toISOString()
              });
              const lokaleProsjekter = JSON.parse(localStorage.getItem('lp_prosjekter') || '[]');
              await setDoc(doc(db, 'brukere', bruker.uid), {
                prosjekter: lokaleProsjekter,
                aktivtProsjekt: pid,
                oppdatert: new Date().toISOString()
              });
              console.log('[SYNK] ✓ Migrering fullført med pid:', pid);
              visSynkStatus('✓ Migrert til ny struktur', '#27ae60');
            } catch(e) {
              console.error('[SYNK] Migrering feilet:', e);
            }
          }
        } else if (brukerData.prosjekter) {
          // Ny struktur finnes i sky — synkroniser prosjektliste
          const skyProsjekter = brukerData.prosjekter;
          const lokaleProsjekter = JSON.parse(localStorage.getItem('lp_prosjekter') || '[]');

          // Slå sammen: sky er master, men legg til lokale prosjekter som ikke finnes i sky
          const merged = [...skyProsjekter];
          lokaleProsjekter.forEach(lp => {
            if (!merged.find(sp => sp.id === lp.id)) merged.push(lp);
          });

          // Sjekk om lokale prosjekter har ID-er som ikke matcher sky
          // (skjer ved migrering på flere enheter – ulike random ID-er)
          const lokaleUkjente = lokaleProsjekter.filter(lp => !skyProsjekter.find(sp => sp.id === lp.id));
          if (lokaleUkjente.length > 0 && skyProsjekter.length > 0) {
            // Enheten har prosjekt-ID-er som skyen ikke kjenner
            // Migrer lokal data til skyens prosjekt-ID-er
            console.log('[SYNK] Fant lokale prosjekter som ikke matcher sky, migrerer...');
            for (const lokal of lokaleUkjente) {
              // Finn matchende sky-prosjekt basert på navn
              const skyMatch = skyProsjekter.find(sp =>
                sp.navn === lokal.navn && !lokaleProsjekter.find(lp => lp.id === sp.id)
              );
              if (skyMatch) {
                console.log('[SYNK] Migrerer lokal', lokal.id, '→ sky', skyMatch.id, '(' + lokal.navn + ')');
                if (window._migrLocalKeys) window._migrLocalKeys(lokal.id, skyMatch.id);
                // Fjern det lokale prosjektet fra merged-lista
                const idx = merged.findIndex(p => p.id === lokal.id);
                if (idx !== -1) merged.splice(idx, 1);
              }
            }
          }

          // Oppdater hovedscriptets variabler via bridge
          const lokalAktivt = window._getAktivtProsjektId();
          let nyttAktivt = lokalAktivt;
          if (!merged.find(p => p.id === lokalAktivt) && merged.length > 0) {
            nyttAktivt = brukerData.aktivtProsjekt || merged[0].id;
          }

          window._settProsjektFraSky(merged, nyttAktivt);
          console.log('[SYNK] Prosjektliste synket, aktivt:', nyttAktivt, 'prosjekter:', merged.length);
        }
      }

      // Last aktivt prosjekt fra sky
      const pid = window._getAktivtProsjektId();
      if (pid) {
        await _lastProsjektFraSky(bruker.uid, pid);
        visSynkStatus('✓ Hentet fra sky', '#27ae60');
      }

      // Last inn appen med sky-data
      _oppdaterAppFraSky();
      if (typeof oppdaterProsjektTittel === 'function') oppdaterProsjektTittel();
      if (typeof settProsjektFarger === 'function') {
        const p = (window._getProsjekter() || []).find(p => p.id === window._getAktivtProsjektId());
        if (p) settProsjektFarger(p.farge);
      }

      // Vis varsel-banner nå som bruker er logget inn
      if ('Notification' in window && Notification.permission === 'default') {
        const avvist = localStorage.getItem('varsel_avvist');
        if (!avvist) document.getElementById('varselBanner').style.display = 'flex';
      }

      // Start lytter for aktivt prosjekt
      if (pid) _startProsjektLytter(bruker.uid, pid);

      // Lytt på endringer i prosjektlisten fra andre enheter
      let firstBrukerSnap = true;
      window._unsubBruker = onSnapshot(doc(db, 'brukere', bruker.uid), snap => {
        if (firstBrukerSnap) { firstBrukerSnap = false; return; }
        if (!snap.exists()) return;
        const data = snap.data();
        if (data.prosjekter) {
          const skyProsjekter = data.prosjekter;
          const lokalt = JSON.stringify(window._getProsjekter() || []);
          const sky = JSON.stringify(skyProsjekter);
          if (sky !== lokalt) {
            console.log('[SYNK] Prosjektliste oppdatert fra sky');
            window._settProsjektFraSky(skyProsjekter, null);
            if (typeof oppdaterProsjektTittel === 'function') oppdaterProsjektTittel();
          }
        }
      });

    } else {
      // Ikke logget inn
      if (window._unsub) window._unsub();
      if (window._unsubBruker) window._unsubBruker();
      loginOverlay.style.display = 'flex';
      const innstBruker = document.getElementById('innstillingerBruker');
      if (innstBruker) innstBruker.style.display = 'none';
      window._currentUid = null;
    }
  });
</script>
